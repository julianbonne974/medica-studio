<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preopia, maquette V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="commun/tifaifai.css">
<style>
  [hidden] { display: none !important; }
  body { background: var(--coton); }
  main:focus { outline: none; }

  /* Bandeau de maquette */
  .lien-maquette {
    border: 0; background: transparent; color: var(--encre-2); cursor: pointer; padding: 2px 6px;
    font-size: var(--t-xs); border-radius: var(--r-s); text-decoration: underline; text-underline-offset: 3px;
  }
  .lien-maquette:hover { color: var(--appl); }
  .lien-maquette[aria-pressed="true"] { color: var(--appl); font-weight: 600; }
  .maquette .outils { display: flex; gap: var(--e2); flex-wrap: wrap; }

  /* Barre et recherche universelle */
  .marque .motif { width: 26px; height: 26px; }
  .recherche { position: relative; flex: 1 1 340px; max-width: 580px; min-width: 0; }
  .champ-r {
    display: flex; align-items: center; gap: var(--e2); min-height: 38px; padding: 0 10px;
    border: 1px solid var(--filet); border-radius: var(--r-s); background: var(--coton);
  }
  .champ-r:focus-within { border-color: var(--appl); background: var(--papier); box-shadow: 0 0 0 3px var(--papier), 0 0 0 4px var(--appl-trace); }
  .champ-r svg { width: 16px; height: 16px; color: var(--encre-3); flex: none; }
  .champ-r input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; padding: 7px 0; }
  .champ-r input::placeholder { color: var(--encre-3); }
  .type-r { font-size: var(--t-xs); color: var(--appl); font-weight: 600; white-space: nowrap; }
  kbd {
    font-family: var(--chiffres); font-size: var(--t-xs); color: var(--encre-2); background: var(--papier);
    border: 1px solid var(--filet); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; white-space: nowrap;
  }
  .deroulant {
    position: absolute; top: calc(100% + 6px); left: 0; width: min(660px, calc(100vw - 32px)); z-index: 30;
    background: var(--papier); border-radius: var(--r); box-shadow: var(--ombre);
    padding: 6px; max-height: 72vh; overflow: auto;
  }
  .der-tete { padding: 6px 10px 8px; font-size: var(--t-xs); color: var(--encre-3); }
  .der-tete b { color: var(--appl); }
  .option {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--e3); padding: 8px 10px;
    border-radius: var(--r-s); cursor: pointer;
  }
  .option[aria-selected="true"], .option:hover { background: var(--appl-voile); }
  .option .o-nom { font-weight: 600; }
  .option .o-dn { font-family: var(--chiffres); font-size: var(--t-s); color: var(--encre-2); text-align: right; }
  .option .o-detail { grid-column: 1 / -1; font-size: var(--t-xs); color: var(--encre-2); }
  .option .o-va { font-size: var(--t-xs); color: var(--appl); text-align: right; }
  .option.nouveau { grid-template-columns: auto minmax(0, 1fr); align-items: center; border-top: 1px solid var(--filet); margin-top: 4px; padding-top: 10px; color: var(--appl); }
  .option.nouveau svg { width: 18px; height: 18px; }
  .option.nouveau small { display: block; color: var(--encre-3); font-size: var(--t-xs); }

  .restreint {
    display: flex; gap: var(--e2); align-items: center; padding: 8px var(--e4);
    background: var(--vigil-voile); color: var(--vigil); font-weight: 600; font-size: var(--t-s);
  }
  .restreint svg { width: 16px; height: 16px; flex: none; }
  .restreint span { font-weight: 400; color: var(--encre-2); }

  /* Pages */
  .page { padding: var(--e5) var(--e4) var(--e6); max-width: 1720px; margin: 0 auto; display: grid; gap: var(--e5); min-width: 0; }
  .titre-page { display: flex; align-items: baseline; gap: var(--e2) var(--e4); flex-wrap: wrap; }
  .titre-page h1 { font-size: var(--t-2xl); letter-spacing: -0.01em; }
  .titre-page .sous { color: var(--encre-2); margin: 0; }
  .titre-page .espace { min-width: 1px; }
  .sous { color: var(--encre-2); margin: 0; font-size: var(--t-s); }
  h2.section { font-size: var(--t-l); display: flex; align-items: baseline; gap: var(--e2); flex-wrap: wrap; margin-bottom: var(--e2); }
  .compte { font-weight: 400; color: var(--encre-3); font-size: var(--t-s); }
  .lien {
    border: 0; background: none; padding: 0; color: var(--encre); font-weight: 600; cursor: pointer; text-align: left;
    text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px;
  }
  .lien:hover { color: var(--appl); text-decoration-color: currentColor; }
  td small, .petit-gris { display: block; color: var(--encre-3); font-size: var(--t-xs); }
  table.liste td.num, table.liste .num { font-variant-numeric: tabular-nums; }
  tr.tout-imprime td { color: var(--encre-3); }

  /* Demain */
  .demain { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--e5); align-items: start; }
  @media (min-width: 1500px) { .demain { grid-template-columns: minmax(0, 1fr) 360px; } .jour { position: sticky; top: 72px; } }
  .programme { display: grid; gap: var(--e5); min-width: 0; }
  .demain > *, .programme > * { min-width: 0; }
  .lot {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--e3) var(--e4); align-items: center;
    padding: 18px 22px; border-radius: var(--r); background: var(--appl-voile);
    outline: 1.5px dashed var(--appl-trace); outline-offset: -7px;
  }
  .lot .motif { width: 46px; height: 46px; }
  .lot h2 { font-size: var(--t-l); }
  .lot p { margin: 3px 0 0; color: var(--encre-2); font-size: var(--t-s); }
  .lot-actions { display: flex; gap: var(--e2); flex-wrap: wrap; justify-content: flex-end; }
  .lot-confirm {
    grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--e2) var(--e3); align-items: center;
    padding-top: var(--e3); border-top: 1px dashed var(--appl-trace); font-size: var(--t-s);
  }
  .lot-confirm p { flex: 1 1 320px; margin: 0; color: var(--encre); }
  @media (max-width: 760px) { .lot { grid-template-columns: minmax(0, 1fr); } .lot .motif { display: none; } .lot-actions { justify-content: flex-start; } }
  .piece.replie > header { background: var(--coton-2); color: var(--encre-3); }
  .piece.replie > header .aide { color: var(--encre-3); opacity: 1; }
  @media (max-width: 700px) {
    table.liste.programme-jour thead { display: none; }
    table.liste.programme-jour, table.liste.programme-jour tbody { display: block; }
    table.liste.programme-jour tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; padding: 12px; border-bottom: 1px solid var(--filet); }
    table.liste.programme-jour td { display: block; padding: 0; border: 0; min-width: 0; }
    table.liste.programme-jour td:nth-child(1) { grid-column: 1 / 2; }
    table.liste.programme-jour td:nth-child(2) { grid-column: 2 / 4; }
    table.liste.programme-jour td:nth-child(3), table.liste.programme-jour td:nth-child(4), table.liste.programme-jour td:nth-child(5) { grid-column: 1 / -1; }
    table.liste.programme-jour td[data-label]::before { content: attr(data-label); display: block; font-size: var(--t-xs); color: var(--encre-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
    table.liste.programme-jour td:nth-child(1)::before, table.liste.programme-jour td:nth-child(2)::before { display: none; }
  }
  .pastilles { display: flex; flex-wrap: wrap; gap: 4px; }
  .pastille { font-size: var(--t-xs); font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--rappel-voile); color: var(--rappel); white-space: nowrap; }
  .pastille.vigil { background: var(--vigil-voile); color: var(--vigil); }
  .pastille.info { background: var(--appl-voile); color: var(--appl); }
  .pastille.neutre { background: var(--coton-2); color: var(--encre-2); }
  .aucun { color: var(--encre-3); font-size: var(--t-xs); }
  .jour h2 { font-size: var(--t-l); margin-bottom: 2px; }
  .jour .sous { margin-bottom: var(--e3); }
  .jour-liste { list-style: none; margin: 0; padding: 0; background: var(--papier); border-radius: var(--r); box-shadow: var(--ombre); }
  .jour-liste li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px var(--e3); padding: 12px 14px; border-bottom: 1px solid var(--filet); align-items: center; }
  .jour-liste li:last-child { border-bottom: 0; }
  .jour-liste .detail { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px var(--e3); align-items: center; font-size: var(--t-xs); color: var(--encre-2); }
  .jour-liste .vide { padding: var(--e5) var(--e4); }

  /* Consultation */
  .bandeau .lien-bandeau {
    display: inline-block; margin-top: 6px; border: 0; background: none; padding: 0; cursor: pointer;
    color: var(--sur-appl); font-size: var(--t-xs); text-decoration: underline; text-underline-offset: 3px; opacity: 0.9;
  }
  .bandeau :focus-visible { outline-color: var(--sur-appl); }
  @media (max-width: 600px) { .bandeau { grid-template-columns: 1fr 1fr; } .bandeau .nom { grid-column: 1 / -1; } }
  .cs-corps { display: grid; grid-template-columns: minmax(0, 1fr) 240px; align-items: start; }
  @media (min-width: 601px) { .bandeau { grid-template-columns: minmax(210px, 1.6fr) repeat(auto-fit, minmax(110px, 1fr)); } }
  .cs-zone { min-width: 0; }
  .fiche { --pli: 158px; }
  .moitie-titre { margin: 0; font-weight: 600; }
  .moitie-titre .num { letter-spacing: 0; text-transform: none; }
  .piece > header h3 { font: inherit; letter-spacing: inherit; }
  .saisie-bloc { display: grid; gap: 6px; min-width: 0; align-content: start; }
  .rang { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: var(--e3); }
  .rang.cinq { grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); }
  .champ input.num { font-family: var(--chiffres); font-variant-numeric: tabular-nums; }
  .champ textarea { min-height: 48px; }
  .marque-repris, .marque-garde {
    position: absolute; right: 6px; top: 0; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700;
  }
  .marque-repris { color: var(--encre-3); }
  .ras-pose.fixe::after { animation: none; }
  .garde { position: relative; }
  .garde::after {
    content: ""; position: absolute; inset: auto -5px -5px -5px; top: calc(1.2em + 4px - 5px);
    border: 1.5px dashed var(--vigil); border-radius: 9px; pointer-events: none;
  }
  .marque-garde { color: var(--vigil); }
  .ligne-case { display: flex; gap: var(--e2); align-items: center; font-size: var(--t-s); font-weight: 600; }
  .ligne-case input { width: 18px; height: 18px; accent-color: var(--appl); }
  .identite-liste { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px var(--e3); margin: 0; font-size: var(--t-s); }
  .identite-liste dt { font-size: var(--t-xs); color: var(--encre-3); }
  .identite-liste dd { margin: 0; font-weight: 600; }
  .valider { display: grid; gap: var(--e2); justify-items: start; padding-top: var(--e2); border-top: 1px dashed var(--appl-trace); }
  .valider p { margin: 0; font-size: var(--t-xs); color: var(--encre-2); }
  .replie .corps { gap: var(--e3); }
  .replie p { margin: 0; color: var(--encre-2); font-size: var(--t-s); }
  .lecture-seule .piece > header { background: var(--coton-2); color: var(--encre-2); }

  /* Ordonnance en photo */
  .ordo { display: grid; gap: var(--e2); padding: 10px; border-radius: var(--r-s); background: var(--coton); }
  .ordo-tete { display: flex; gap: var(--e2) var(--e3); align-items: center; flex-wrap: wrap; }
  .ordo-tete .lib { font-size: var(--t-xs); font-weight: 600; color: var(--encre-2); }
  .ordo input[type="file"]:focus-visible + label { outline: 2px solid var(--appl); outline-offset: 2px; }
  .ordo-vignette { width: 44px; height: 56px; object-fit: cover; border-radius: 4px; box-shadow: var(--ombre); }
  .ordo-fichier { font-size: var(--t-xs); color: var(--encre-2); min-width: 0; overflow-wrap: anywhere; }
  .ordo-ligne { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; }
  .ordo-ligne input { width: 100%; min-height: 32px; padding: 5px 8px; border-radius: var(--r-s); border: 1px dashed var(--vigil); background: var(--papier); font-size: var(--t-s); min-width: 0; }
  .ordo-ligne input:focus { outline: none; border-color: var(--appl); border-style: solid; }
  .ordo-ligne.fait { grid-template-columns: auto minmax(0, 1fr); font-size: var(--t-s); color: var(--ok); }
  .ordo-ligne.fait.ecarte { color: var(--encre-3); text-decoration: line-through; }
  .ordo-ligne.fait svg { width: 16px; height: 16px; }

  /* Pli central */
  .pli { align-content: start; }
  .pli .motif { width: 58px; height: 58px; }
  .pli .btn { min-height: 40px; padding: 4px 8px; text-align: center; line-height: 1.2; white-space: normal; }
  .pli .btn.plein { min-height: 46px; font-weight: 700; }
  .pli .note-pli { font-size: var(--t-xs); color: var(--encre-3); text-align: center; background: var(--coton); padding: 4px 0; }
  .avance { width: 100%; display: grid; gap: 5px; justify-items: center; text-align: center; font-size: var(--t-xs); color: var(--encre-2); background: var(--coton); padding: 6px 0; }
  .avance b { font-size: var(--t-xl); color: var(--encre); font-weight: 700; }
  .avance-trait { position: relative; width: 100%; height: 0; border-top: 2px dashed var(--appl-trace); }
  .avance-trait i { position: absolute; left: 0; top: -2px; height: 2px; background: var(--appl); transition: width 200ms ease-out; }
  .raccourcis { width: 100%; font-size: var(--t-xs); color: var(--encre-2); background: var(--coton); }
  .raccourcis summary { cursor: pointer; text-align: center; padding: 4px; color: var(--appl); font-weight: 600; }
  .raccourcis dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 6px; margin: 6px 0 0; align-items: baseline; }
  .raccourcis dd { margin: 0; }
  @media (max-width: 900px) {
    .pli { display: flex; flex-wrap: wrap; gap: var(--e2); align-items: center; overflow: visible; padding-inline: 0; }
    .pli .motif { display: none; }
    .pli .btn { width: auto; }
    .avance { width: 150px; }
    .raccourcis { width: 100%; }
  }

  /* Documents vivants */
  .docs { position: sticky; top: 64px; padding: var(--e4) var(--e4) var(--e4) 2px; display: grid; gap: var(--e2); align-content: start; }
  .docs-titre { font-size: var(--t-s); font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: var(--e2); }
  .docs-titre span { font-weight: 400; font-size: var(--t-xs); color: var(--encre-3); }
  .doc-carte { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px; border-radius: var(--r); }
  .doc-carte.actif { background: var(--appl-voile); }
  .mini { width: 84px; height: 119px; overflow: hidden; background: #ffffff; border-radius: 3px; box-shadow: var(--ombre); cursor: pointer; position: relative; transition: transform 150ms ease-out; }
  .mini:hover { transform: translateY(-2px); }
  .mini-page { width: 210mm; transform: scale(0.1058); transform-origin: 0 0; pointer-events: none; }
  .mini .a4 { box-shadow: none; max-width: none; width: 210mm; }
  .doc-texte { display: grid; gap: 5px; justify-items: start; font-size: var(--t-xs); color: var(--encre-2); min-width: 0; }
  .doc-nom { font-weight: 600; color: var(--encre); font-size: var(--t-s); line-height: 1.25; }
  .doc-note { line-height: 1.3; }
  .doc-note.manque { color: var(--encre-2); }
  @media (max-width: 1279px) {
    .cs-corps { grid-template-columns: minmax(0, 1fr); }
    .docs { order: -1; position: static; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); padding: var(--e3) var(--e4) 0; }
    .docs-titre { grid-column: 1 / -1; }
  }

  /* Aperçu */
  .apercu-barre { display: flex; flex-wrap: wrap; gap: var(--e2); align-items: center; padding: var(--e3) var(--e4); background: var(--papier); border-bottom: 1px solid var(--filet); }
  .onglets { display: flex; gap: 4px; flex-wrap: wrap; }
  .btn[aria-pressed="true"] { background: var(--appl); border-color: var(--appl); color: var(--sur-appl); }
  .note-modele { padding: 8px var(--e4); background: var(--vigil-voile); color: var(--vigil); font-size: var(--t-s); font-weight: 600; }
  .note-modele span { font-weight: 400; color: var(--encre-2); }
  .planche { min-width: 0; }

  /* A4 (reste blanc dans les deux thèmes) */
  .a4 p { margin: 3px 0; }
  .a4 ul { margin: 3px 0; padding-left: 18px; }
  .a4 .entete small { color: #555; }
  .a4 .vide-a4 { color: #9a9a9a; }
  .a4 .case { display: inline-block; width: 10px; height: 10px; border: 1px solid #333; margin-right: 6px; vertical-align: -1px; }
  .a4 .encadre { border: 1px solid #13457b; padding: 6px 9px; margin-top: 6px; }
  .a4 .encadre b { color: #13457b; }
  .a4 .a-reprendre { border: 1px dashed #999; color: #666; padding: 8px; margin-top: 8px; font-size: 9.5pt; }
  .a4 .titre-doc { text-align: right; }
  .a4 .pied-a4 { position: absolute; bottom: 8mm; left: 14mm; right: 14mm; font-size: 7.5pt; color: #888; display: flex; justify-content: space-between; gap: 8px; }
  .a4 [contenteditable="true"] { outline: 1px dashed #13457b; outline-offset: 2px; background: #f2f6fb; border-radius: 2px; }
  .a4 [contenteditable="true"]:focus { outline-style: solid; }
  .a4 .mention { font-size: 9pt; color: #444; }

  /* Formulaires de page */
  .actions { display: flex; gap: var(--e2); flex-wrap: wrap; align-items: center; }
  .erreur { color: var(--rappel); font-size: var(--t-xs); font-weight: 600; }
  .form-nv { max-width: 900px; }
  .case-sans { display: flex; gap: 6px; align-items: center; font-size: var(--t-s); margin-top: 4px; }
  .case-sans input { width: 16px; height: 16px; accent-color: var(--appl); }
  .choix { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--e3); }
  .choix > div { display: grid; gap: 6px; justify-items: start; align-content: start; }
  .choix p { margin: 0; font-size: var(--t-s); color: var(--encre-2); }
  .lecture { display: grid; grid-template-columns: minmax(110px, 40%) minmax(0, 1fr); gap: 6px var(--e3); margin: 0; font-size: var(--t-s); }
  .lecture dt { color: var(--encre-3); }
  .lecture dd { margin: 0; font-weight: 600; }
  .grille-lecture { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--e4); align-items: start; }

  /* Chronomètre */
  .chrono { flex-wrap: wrap; max-width: min(640px, calc(100vw - 32px)); }
  .chrono svg { width: 16px; height: 16px; }
  .chrono select { background: var(--encre); color: var(--coton); border: 1px solid color-mix(in srgb, var(--coton) 30%, transparent); border-radius: var(--r-s); padding: 3px 6px; max-width: 260px; }
  .chrono-temps { font-size: var(--t-l); min-width: 6ch; }
  .chrono-res { flex-basis: 100%; font-size: var(--t-xs); opacity: 0.85; display: grid; gap: 2px; }
  .chrono-res:empty { display: none; }

  /* ===================== V1 ===================== */
  :root { --barre-h: 56px; --tete-h: 0px; }
  /* Le socle donne height: 100% au body, ce qui borne le collant de la barre au premier écran. */
  html, body { height: auto; min-height: 100%; }

  /* Sélecteur de version, enregistrement */
  .versions { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .v-choix { display: inline-flex; align-items: center; gap: 4px; }
  .v-choix a { color: var(--encre-2); text-decoration: underline; text-underline-offset: 3px; padding: 1px 4px; border-radius: var(--r-s); }
  .v-choix a:hover { color: var(--appl); }
  .v-choix a[aria-current="page"] { color: var(--sur-appl); background: var(--appl); text-decoration: none; font-weight: 700; }
  .sauve { margin: 0; display: inline-flex; align-items: center; gap: 7px; font-size: var(--t-xs); color: var(--encre-2); white-space: nowrap; min-width: 0; }
  .sauve-point { width: 9px; height: 9px; border-radius: 50%; background: var(--appl); flex: none; transition: background 150ms ease-out; }
  .sauve[data-etat="encours"] .sauve-point { background: transparent; box-shadow: inset 0 0 0 1.5px var(--appl); }
  .sauve[data-etat="horsligne"] { color: var(--encre); font-weight: 600; }
  .sauve[data-etat="horsligne"] .sauve-point { background: transparent; border: 1.5px dashed var(--encre-2); }
  @media (max-width: 1100px) { .sauve { white-space: normal; } }

  /* Tête de fiche collante : bandeau, bande d'intubation, patient connu */
  /* Le bandeau complet reste dans le flux ; quand il passe sous la barre, le bandeau compact,
     fixé exactement sous ce qui reste visible en haut (barre collante, ou rien sous 700 px), prend le relais.
     Les hauteurs viennent d'un ResizeObserver, au pixel près ; le compact glisse 1 px sous la barre pour qu'aucun interstice n'apparaisse. */
  .tete-fiche { position: relative; z-index: 15; }
  .tete-compacte {
    position: fixed; left: 0; right: 0; top: max(0px, calc(var(--barre-h) - 1px)); z-index: 18;
    background: var(--appl-plein); color: var(--sur-plein); box-shadow: 0 1px 0 var(--filet), 0 6px 14px #0d1b2a1f;
    visibility: hidden; opacity: 0; transform: translateY(-6px); pointer-events: none;
    transition: opacity 160ms cubic-bezier(.16,1,.3,1), transform 160ms cubic-bezier(.16,1,.3,1), visibility 0s linear 160ms;
  }
  .tete-compacte.visible { visibility: visible; opacity: 1; transform: none; pointer-events: auto; transition-delay: 0s; }
  .compacte-ligne { display: flex; align-items: center; flex-wrap: wrap; gap: 4px var(--e3); padding: 6px var(--e4); min-width: 0; }
  .c-nom { font-size: var(--t-l); font-weight: 700; letter-spacing: -0.005em; white-space: nowrap; }
  .c-info { font-size: var(--t-s); white-space: nowrap; opacity: 0.92; }
  .c-info b { font-weight: 700; }
  .c-info.nr { opacity: 0.75; font-style: normal; }
  .c-info + .c-info::before { content: "·"; margin-right: var(--e3); opacity: 0.6; }
  .compacte-ligne .badge { font-size: var(--t-xs); padding: 1px 9px; }
  .tete-compacte .bande-intub { padding-block: 4px; font-size: var(--t-xs); flex-wrap: nowrap; white-space: nowrap; overflow: hidden; }
  .tete-compacte .bande-intub span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  @media (max-width: 700px) {
    .compacte-ligne { gap: 2px var(--e2); padding: 5px var(--e3); }
    .c-nom { font-size: var(--t-m); flex-basis: 100%; }
    .c-info + .c-info::before { margin-right: var(--e2); }
    .compacte-ligne .badge { max-width: calc(50vw - 20px); }
  }
  @media (max-width: 700px) {
    .bandeau.v1 .info { display: none; }
    .bandeau.v1 .nom { font-size: var(--t-xl); }
    .bandeau.v1 .nom small, .bandeau.v1 .lien-bandeau { font-size: var(--t-xs); }
    .bandeau.v1 { padding-block: 8px; }
    .bandeau-bas { padding-top: 4px; }
    .synthese { font-size: var(--t-xs); }
    .bande-intub { padding-block: 5px; font-size: var(--t-xs); }
  }
  .bandeau.v1 { grid-template-columns: minmax(200px, 1.5fr) repeat(auto-fit, minmax(84px, 1fr)); row-gap: 6px; padding-block: 10px; }
  .bandeau.v1 .info b { white-space: nowrap; }
  .bandeau.v1 .info b.nr { font-weight: 400; opacity: 0.8; font-size: var(--t-s); }
  .bandeau-bas { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px var(--e3); align-items: center; padding-top: 6px; border-top: 1px dashed color-mix(in srgb, var(--sur-plein) 35%, transparent); }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: var(--t-s); font-weight: 600; line-height: 1.35; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .badge svg { width: 14px; height: 14px; flex: none; }
  .badge.acte { background: #ffffff; color: var(--appl-plein); }
  .badge.allergie { background: var(--rappel-voile); color: var(--rappel); }
  .badge.sans { border: 1px solid color-mix(in srgb, var(--sur-plein) 60%, transparent); color: var(--sur-plein); }
  .badge.nr { border: 1px dashed color-mix(in srgb, var(--sur-plein) 70%, transparent); color: var(--sur-plein); font-weight: 400; }
  .badge.profil { color: var(--sur-plein); opacity: 0.9; font-weight: 400; padding-inline: 2px; }
  .synthese { margin: 0; flex: 1 1 360px; min-width: 0; font-size: var(--t-s); color: var(--sur-plein); }
  .synthese b { font-weight: 700; }
  .synthese .lib-s { text-transform: uppercase; letter-spacing: 0.06em; font-size: var(--t-xs); opacity: 0.75; margin-right: 6px; }
  .bande-intub {
    display: flex; gap: var(--e2) var(--e3); align-items: center; flex-wrap: wrap; padding: 7px var(--e4);
    background: var(--rappel); color: #ffffff; font-weight: 700; font-size: var(--t-s); letter-spacing: 0.02em;
  }
  :root[data-theme="dark"] .bande-intub { color: #1a0605; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bande-intub { color: #1a0605; } }
  .bande-intub svg { width: 16px; height: 16px; flex: none; }
  .bande-intub span { font-weight: 400; }
  .connu {
    display: flex; gap: var(--e2) var(--e3); align-items: flex-start; flex-wrap: wrap; padding: 8px var(--e4);
    background: var(--rappel-voile); color: var(--rappel); font-size: var(--t-s);
  }
  .connu > svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
  .connu-corps { flex: 1 1 400px; min-width: 0; display: grid; gap: 2px; }
  .connu b { font-weight: 700; }
  .connu ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; color: var(--encre); }
  .connu li small { color: var(--encre-2); font-size: var(--t-xs); }
  .connu .lien { color: var(--rappel); font-size: var(--t-xs); text-decoration-color: currentColor; }
  .pli { top: calc(var(--barre-h) + var(--tete-h) + 12px); max-height: calc(100vh - var(--barre-h) - var(--tete-h) - 24px); overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
  .docs { top: calc(var(--barre-h) + var(--tete-h) + 4px); max-height: calc(100vh - var(--barre-h) - var(--tete-h) - 8px); overflow-y: auto; }
  @media (max-width: 1279px) { .docs { max-height: none; overflow: visible; } }
  @media (max-width: 900px) { .pli { max-height: none; overflow: visible; } }
  .piece { scroll-margin-top: calc(var(--barre-h) + var(--tete-h) + 16px); }
  .saisie-bloc, .champ, .vignette, .plan-ligne { scroll-margin-top: calc(var(--barre-h) + var(--tete-h) + 24px); }

  /* Marques P1 : RAS ou défaut, à confirmer */
  .marque-ras, .marque-repris { border: 0; background: none; cursor: pointer; padding: 0 2px; border-radius: 3px; }
  .marque-ras:hover, .marque-repris:hover { text-decoration: underline; text-underline-offset: 2px; }
  .marque-repris { color: var(--appl); }
  .repris-champ { position: relative; }
  .repris-champ input, .repris-champ textarea { border-style: dashed; border-color: var(--appl-trace); }
  .confirmer-piece { border: 1px dashed color-mix(in srgb, var(--sur-plein) 70%, transparent); background: transparent; color: var(--sur-plein); border-radius: var(--r-s); padding: 1px 8px; font-size: var(--t-xs); cursor: pointer; text-transform: none; letter-spacing: 0; font-weight: 600; white-space: nowrap; }
  .confirmer-piece:hover { background: color-mix(in srgb, var(--sur-plein) 16%, transparent); }
  .piece > header .tete-droite { display: inline-flex; gap: var(--e2); align-items: center; flex-wrap: wrap; justify-content: flex-end; }

  /* Rappels : règle fixe et donnée déclenchante (P2, P3) */
  .rappel .r-tete { display: flex; gap: 6px var(--e2); align-items: baseline; flex-wrap: wrap; }
  .regle {
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 0 6px; border-radius: 999px;
    border: 1px solid currentColor; opacity: 0.85; cursor: help; line-height: 1.5;
  }
  .rappel .decl { margin: 2px 0 0; font-weight: 400; color: var(--encre-2); display: grid; gap: 1px; }
  .rappel .decl b { color: var(--encre); font-weight: 600; }
  .rappel .decl small { color: var(--encre-3); font-size: var(--t-xs); }

  /* Règle d'affichage visible au survol (P7) */
  .regle-aff { position: relative; display: inline-flex; align-items: center; gap: 4px; cursor: help; text-decoration: underline dotted; text-underline-offset: 3px; }
  .regle-aff::after {
    content: attr(data-texte); position: absolute; right: 0; top: calc(100% + 6px); z-index: 25; white-space: nowrap;
    background: var(--encre); color: var(--coton); padding: 4px 8px; border-radius: var(--r-s); font-size: var(--t-xs); font-weight: 400;
    letter-spacing: 0; text-transform: none; box-shadow: var(--ombre); pointer-events: none; display: none;
  }
  .regle-aff:hover::after, .regle-aff:focus-visible::after { display: block; animation: bulle 150ms cubic-bezier(.16,1,.3,1) both; }
  @keyframes bulle { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }
  .regle-aff:focus-visible { outline-color: var(--sur-plein); }

  /* Segments (profil, site, continuer / arrêter, seuils) */
  .segment { display: inline-flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--filet); border-radius: var(--r-s); overflow: hidden; background: var(--papier); }
  .segment button { border: 0; border-right: 1px solid var(--filet); background: transparent; padding: 6px 12px; min-height: 34px; cursor: pointer; color: var(--encre-2); font-size: var(--t-s); }
  .segment button:last-child { border-right: 0; }
  .segment button:hover { color: var(--appl); background: var(--appl-voile); }
  .segment button[aria-pressed="true"] { background: var(--appl); color: var(--sur-appl); font-weight: 600; }
  .segment button:disabled { cursor: default; }
  .segment button:disabled:not([aria-pressed="true"]) { color: var(--encre-3); background: transparent; }
  .segment.petit button { min-height: 28px; padding: 3px 10px; }
  .note-regle { font-size: var(--t-xs); color: var(--encre-3); }

  /* Création de consultation : l'acte d'abord */
  .creation .corps { gap: var(--e4); }
  .etape { display: grid; gap: var(--e2); min-width: 0; }
  .etape-tete { display: flex; align-items: baseline; gap: var(--e2) var(--e3); flex-wrap: wrap; }
  .etape-tete h3 { font-size: var(--t-m); }
  .etape-tete .sous { font-size: var(--t-xs); }
  .puces { display: flex; flex-wrap: wrap; gap: 8px; }
  .puce-acte {
    border: 1px solid var(--filet); background: var(--papier); color: var(--encre); border-radius: var(--r-s);
    padding: 7px 12px; min-height: 38px; cursor: pointer; font-weight: 600; font-size: var(--t-s); letter-spacing: 0.01em;
    transition: border-color 150ms ease-out, background 150ms ease-out;
  }
  .puce-acte small { display: block; font-weight: 400; color: var(--encre-3); font-size: 11px; letter-spacing: 0; }
  .puce-acte:hover { border-color: var(--appl); color: var(--appl); }
  .puce-acte[aria-pressed="true"] { background: var(--appl); border-color: var(--appl); color: var(--sur-appl); }
  .puce-acte[aria-pressed="true"] small { color: var(--sur-appl); opacity: 0.8; }
  .acte-recherche { display: flex; gap: var(--e2); align-items: center; flex-wrap: wrap; }
  .acte-recherche .champ-r { flex: 1 1 260px; max-width: 420px; background: var(--papier); }
  .acte-resultats { display: flex; flex-wrap: wrap; gap: 6px; }
  .consignes-acte { display: grid; gap: 6px; }
  .creation-actions { display: flex; gap: var(--e2); flex-wrap: wrap; align-items: center; padding-top: var(--e3); border-top: 1px dashed var(--appl-trace); }
  .creation-actions p { margin: 0; font-size: var(--t-xs); color: var(--encre-2); flex: 1 1 220px; }

  /* Comorbidités par appareil (V1-02) */
  .como { display: grid; gap: var(--e2); }
  .como-groupe { position: relative; display: grid; gap: 6px; padding: 8px 10px; border-radius: var(--r-s); background: var(--coton); }
  .como-groupe.ras-pose { background: var(--appl-voile); }
  .como-groupe.ras-pose::after { content: ""; position: absolute; inset: -4px; border: 1.5px dashed var(--appl); border-radius: 9px; pointer-events: none; animation: piqure 520ms cubic-bezier(.16,1,.3,1) both; }
  .como-groupe.ras-pose.fixe::after { animation: none; }
  .como-tete { display: flex; align-items: center; gap: var(--e2); flex-wrap: wrap; }
  .como-tete h4 { margin: 0; font-size: var(--t-s); font-weight: 700; }
  .compteur { font-family: var(--chiffres); font-size: var(--t-xs); padding: 0 7px; border-radius: 999px; background: var(--papier); color: var(--encre-2); border: 1px solid var(--filet); }
  .compteur.plein { background: var(--appl); color: var(--sur-appl); border-color: var(--appl); }
  .compteur.ras { background: var(--appl-voile); color: var(--appl); border: 1px dashed var(--appl); font-family: var(--texte); font-weight: 700; }
  .compteur.nr { border-style: dashed; color: var(--encre-3); font-family: var(--texte); }
  .como-tete .espace { flex: 1; }
  .como-tete .marque-ras { position: static; }
  .cases { display: flex; flex-wrap: wrap; gap: 6px; }
  .case {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 7px; border: 1px solid var(--filet); border-radius: var(--r-s);
    background: var(--papier); font-size: var(--t-s); cursor: pointer; color: var(--encre-2); line-height: 1.3; min-height: 30px;
  }
  .case:hover { border-color: var(--appl); color: var(--appl); }
  .case input { width: 16px; height: 16px; margin: 0; accent-color: var(--appl); }
  .case:has(input:checked) { border-color: var(--appl); color: var(--encre); font-weight: 600; background: var(--appl-voile); }
  .case:has(input:disabled) { cursor: default; }
  .case.ajout { border-style: dashed; }
  .como-libre { width: 100%; min-height: 32px; padding: 5px 9px; border-radius: var(--r-s); border: 1px solid var(--filet); background: var(--papier); font-size: var(--t-s); }
  .como-libre:focus { border-color: var(--appl); outline: 1.5px dashed var(--appl); outline-offset: 3px; }

  /* Voies aériennes (V1-05) */
  .mallampati { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .vignette {
    display: grid; justify-items: center; gap: 2px; padding: 6px 4px 4px; border: 1px solid var(--filet); border-radius: var(--r-s);
    background: var(--papier); color: var(--encre-2); cursor: pointer; min-width: 0; position: relative;
    transition: border-color 150ms ease-out, background 150ms ease-out;
  }
  .vignette svg { width: 100%; max-width: 92px; height: auto; aspect-ratio: 64 / 56; }
  .vignette b { font-family: var(--chiffres); font-size: var(--t-s); font-weight: 600; color: var(--encre); }
  .vignette:hover { border-color: var(--appl); color: var(--appl); }
  .vignette[aria-pressed="true"] { border-color: var(--appl); background: var(--appl-voile); color: var(--appl); }
  .vignette[aria-pressed="true"]::after { content: ""; position: absolute; inset: -4px; border: 1.5px dashed var(--appl); border-radius: 9px; pointer-events: none; }
  .vignette:disabled { cursor: default; }
  .mv-trait { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .mv-fond { fill: var(--coton); }
  .vignette[aria-pressed="true"] .mv-fond { fill: var(--papier); }
  .mv-langue { fill: var(--papier); stroke: currentColor; stroke-width: 1.6; }
  .mv-langue-t { fill: currentColor; opacity: 0.16; }
  .mv-dur { fill: currentColor; opacity: 0.22; }
  .mv-gorge { fill: currentColor; opacity: 0.2; }
  .seuils { display: flex; flex-wrap: wrap; gap: var(--e3); }
  .seuils .champ { gap: 4px; }
  .dents { display: grid; grid-template-columns: minmax(110px, max-content) repeat(2, 64px); justify-content: start; gap: 4px 10px; align-items: center; font-size: var(--t-s); }
  .dents .d-tete { font-size: var(--t-xs); color: var(--encre-3); font-weight: 600; text-align: center; text-transform: uppercase; letter-spacing: 0.06em; }
  .dents .d-lib { color: var(--encre-2); }
  .d-case { display: grid; place-items: center; min-height: 32px; border: 1px solid var(--filet); border-radius: var(--r-s); background: var(--papier); cursor: pointer; }
  .d-case:hover { border-color: var(--appl); }
  .d-case:has(input:checked) { background: var(--appl-voile); border-color: var(--appl); }
  .d-case input { width: 16px; height: 16px; margin: 0; accent-color: var(--appl); }
  .sous-titre { font-size: var(--t-xs); color: var(--encre-2); font-weight: 600; letter-spacing: 0.02em; display: flex; justify-content: space-between; gap: var(--e2); }

  /* Bornes de plausibilité (V1-12) */
  .bornes { display: grid; gap: 4px; }
  .borne { display: flex; gap: 6px; align-items: flex-start; font-size: var(--t-xs); font-weight: 600; color: var(--vigil); }
  .borne svg { width: 14px; height: 14px; flex: none; margin-top: 1px; }
  .borne span { font-weight: 400; color: var(--encre-2); }
  .hors-borne input { border-style: dashed; border-color: var(--vigil); }

  /* Plan « continuer sauf » (V1-08) */
  .plan { display: grid; gap: 6px; }
  .plan-ligne { display: grid; grid-template-columns: minmax(110px, 1fr) auto; gap: 6px var(--e3); align-items: center; padding: 8px 10px; border-radius: var(--r-s); background: var(--coton); position: relative; }
  .plan-ligne.defaut { background: var(--appl-voile); }
  .plan-ligne.defaut::after { content: ""; position: absolute; inset: -3px; border: 1.5px dashed var(--appl-trace); border-radius: 8px; pointer-events: none; }
  .plan-nom { font-weight: 600; font-size: var(--t-s); overflow-wrap: anywhere; }
  .plan-nom small { display: block; font-weight: 600; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--appl); }
  .plan-arret { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px var(--e3); align-items: center; font-size: var(--t-s); }
  .plan-arret input { width: 64px; min-height: 32px; padding: 4px 8px; border: 1px solid var(--filet); border-radius: var(--r-s); background: var(--papier); font-family: var(--chiffres); }
  .plan-arret input:focus { border-color: var(--appl); outline: 1.5px dashed var(--appl); outline-offset: 3px; }
  .plan-arret label { font-size: var(--t-xs); color: var(--encre-2); font-weight: 600; }
  .derniere-prise { font-weight: 600; }
  .derniere-prise.nr { font-weight: 400; color: var(--encre-3); }
  .plan-pied { display: flex; gap: var(--e2); align-items: center; flex-wrap: wrap; font-size: var(--t-xs); color: var(--encre-2); }

  /* Jeûne en heures (V1-09) */
  .jeune { display: grid; gap: 6px; padding: 10px; border-radius: var(--r-s); background: var(--coton); }
  .jeune-lignes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 6px var(--e3); }
  .jeune-ligne { display: grid; gap: 1px; }
  .jeune-ligne span { font-size: var(--t-xs); color: var(--encre-2); font-weight: 600; }
  .jeune-ligne b { font-family: var(--chiffres); font-size: var(--t-xl); font-weight: 600; line-height: 1.15; }
  .jeune-ligne b.nr { font-family: var(--texte); font-size: var(--t-s); font-weight: 400; color: var(--encre-3); }
  .jeune-ligne small { font-size: var(--t-xs); color: var(--encre-3); }
  .jeune-source { font-size: var(--t-xs); color: var(--encre-3); margin: 0; }

  /* Ordonnance jointe (V1-07) */
  .ordo-jointe { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--e3); align-items: center; }
  .ordo-vignette { width: 52px; height: 66px; }
  .ordo-sans { width: 52px; height: 66px; border-radius: 4px; display: grid; place-items: center; background: var(--papier); color: var(--encre-3); box-shadow: var(--ombre); }
  .ordo-sans svg { width: 20px; height: 20px; }
  .ordo-meta { display: grid; gap: 2px; font-size: var(--t-xs); color: var(--encre-2); min-width: 0; }
  .ordo-meta b { color: var(--encre); font-size: var(--t-s); overflow-wrap: anywhere; }
  .ordo-meta .actions { margin-top: 4px; }

  /* Manques avant impression (V1-10) */
  .lien-manque {
    display: inline; text-align: left; border: 0; background: none; padding: 0; cursor: pointer; color: var(--appl); font-weight: 600; font-size: inherit;
    text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px;
  }
  .lien-manque:hover { text-decoration-style: solid; }
  .manques-lot { grid-column: 1 / -1; display: grid; gap: 6px; padding-top: var(--e3); border-top: 1px dashed var(--appl-trace); }
  .manques-lot h3 { font-size: var(--t-s); display: flex; gap: var(--e2); align-items: baseline; flex-wrap: wrap; }
  .manques-lot h3 span { font-weight: 400; color: var(--encre-2); font-size: var(--t-xs); }
  .manques-lot ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  .manques-lot li { display: flex; flex-wrap: wrap; gap: 2px var(--e3); align-items: baseline; font-size: var(--t-s); padding: 6px 10px; border-radius: var(--r-s); background: var(--papier); }
  .manques-lot li > b { font-weight: 600; min-width: 170px; }
  .manques-lot .m-doc { color: var(--encre-2); font-size: var(--t-xs); }
  .confirme-manque {
    display: flex; flex-wrap: wrap; gap: var(--e2) var(--e3); align-items: center; padding: 10px var(--e4);
    background: var(--vigil-voile); color: var(--encre); font-size: var(--t-s);
  }
  .confirme-manque p { margin: 0; flex: 1 1 360px; }
  .confirme-manque b { color: var(--vigil); }
  .doc-manques { display: inline; }
  .etat.imprime.avec-manque { background: var(--ok-voile); }

  /* Compteurs et motif d'attente (V1-11) */
  .compteur-tete { display: inline-flex; align-items: baseline; gap: 6px; font-size: var(--t-s); color: var(--encre-2); }
  .compteur-tete b { font-family: var(--chiffres); font-size: var(--t-xl); color: var(--encre); font-weight: 600; }
  .motif-attente { font-size: var(--t-xs); color: var(--encre-2); }
  .motif-attente.pret { color: var(--encre-3); }

  /* Chronologie (V1-06) */
  .frise { list-style: none; margin: 0; padding: 0 0 0 4px; display: grid; gap: 0; }
  .frise li { position: relative; display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 2px var(--e3); padding: 6px 0 8px 18px; }
  .frise li::before { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 2px; background: var(--appl-trace); }
  .frise li:first-child::before { top: 12px; }
  .frise li:last-child::before { bottom: calc(100% - 12px); }
  .frise li::after { content: ""; position: absolute; left: 0; top: 9px; width: 10px; height: 10px; border-radius: 50%; background: var(--appl); box-shadow: 0 0 0 3px var(--papier); }
  .frise li.sans-date::after { background: var(--papier); border: 1.5px dashed var(--appl); }
  .frise li.alerte::after { background: var(--rappel); }
  .frise li.prevue::after { background: var(--papier); border: 2px solid var(--appl); }
  .f-date { font-family: var(--chiffres); font-size: var(--t-xs); color: var(--encre-2); padding-top: 2px; }
  .f-date.nr { font-family: var(--texte); color: var(--encre-3); }
  .f-corps { display: grid; gap: 1px; min-width: 0; }
  .f-ligne { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-size: var(--t-s); }
  .f-type { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--appl); }
  .alerte .f-type { color: var(--rappel); }
  .f-lib { font-weight: 600; }
  .f-source { font-size: var(--t-xs); color: var(--encre-3); }
  details.piece > summary { list-style: none; cursor: pointer; }
  details.piece > summary::-webkit-details-marker { display: none; }
  details.piece > summary .chevron { width: 14px; height: 14px; transition: transform 150ms ease-out; }
  details.piece[open] > summary .chevron { transform: rotate(90deg); }
  .piece > summary {
    display: flex; align-items: center; justify-content: space-between; gap: var(--e2);
    padding: 7px var(--e3); background: var(--appl-plein); color: var(--sur-plein);
    font-weight: 700; font-size: var(--t-s); letter-spacing: 0.06em; text-transform: uppercase;
  }
  .piece > summary .aide { font-weight: 400; letter-spacing: 0; text-transform: none; opacity: 0.82; font-size: var(--t-xs); }
  .piece > summary h3 { font: inherit; letter-spacing: inherit; display: inline-flex; gap: 6px; align-items: center; }
  .piece > summary:focus-visible { outline-color: var(--sur-plein); outline-offset: -4px; }
  .vide-petit { color: var(--encre-3); font-size: var(--t-s); margin: 0; }

  /* Signalement (V1-15) */
  .pied { align-items: center; }
  .signaler-panneau {
    position: fixed; left: var(--e4); bottom: calc(var(--e4) + env(safe-area-inset-bottom, 0px)); z-index: 45;
    width: min(380px, calc(100vw - 32px)); background: var(--papier); border-radius: var(--r); box-shadow: var(--ombre), 0 0 0 1px var(--filet);
    display: grid; overflow: hidden;
  }
  .signaler-panneau header { padding: 8px var(--e3); background: var(--appl-plein); color: var(--sur-plein); font-weight: 700; font-size: var(--t-s); letter-spacing: 0.06em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; gap: var(--e2); }
  .signaler-panneau header button { border: 0; background: transparent; color: inherit; cursor: pointer; padding: 2px 6px; border-radius: var(--r-s); font-size: var(--t-xs); text-transform: none; letter-spacing: 0; text-decoration: underline; text-underline-offset: 3px; }
  .signaler-panneau .corps { padding: var(--e3); display: grid; gap: var(--e2); }
  .signaler-panneau p { margin: 0; font-size: var(--t-xs); color: var(--encre-2); }
  .signale-ok { display: flex; gap: var(--e2); align-items: flex-start; font-size: var(--t-s); color: var(--ok); font-weight: 600; }
  .signale-ok svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
  .signale-ok span { display: block; font-weight: 400; color: var(--encre-2); font-size: var(--t-xs); }

  /* Repère d'arrivée sur un champ depuis un manque */
  .repere { animation: repere 1400ms cubic-bezier(.16,1,.3,1) both; border-radius: var(--r-s); }
  @keyframes repere { 0% { box-shadow: 0 0 0 0 var(--appl-trace); } 30% { box-shadow: 0 0 0 6px var(--appl-trace); } 100% { box-shadow: 0 0 0 0 transparent; } }

  @media (max-width: 700px) {
    table.liste.programme-jour td:nth-child(n+6) { grid-column: auto; }
    table.liste.programme-jour td:last-child { grid-column: 1 / -1; }
    .manques-lot li > b { min-width: 0; flex-basis: 100%; }
    .bandeau.v1 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .bandeau.v1 .nom { grid-column: 1 / -1; }
    .synthese { flex-basis: 100%; }
    .dents { grid-template-columns: minmax(0, 1fr) repeat(2, 56px); }
    .connu { padding-block: 6px; }
  }

  /* Compléments V1 */
  .patient-haut { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--e4); align-items: start; min-width: 0; }
  .patient-haut > *, .page > *, .cs-corps > * { min-width: 0; }
  .bandeau .lien-bandeau { color: var(--sur-plein); }
  @media (max-width: 700px) { .barre { position: relative; } .sauve { flex-basis: 100%; order: 9; } }
  .creation-actions .btn { white-space: normal; text-align: left; }
  @media (min-width: 1100px) { .patient-haut { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); } }
  .regle-aff::after { width: max-content; max-width: min(320px, 72vw); white-space: normal; line-height: 1.35; }
  .rappel .regle-aff::after, .r-tete .regle-aff::after { right: auto; left: 0; }
  .regle.regle-aff { text-decoration: none; }
  .piece > header .regle-aff, .piece > summary .regle-aff { font-weight: 400; letter-spacing: 0; text-transform: none; font-size: var(--t-xs); color: var(--sur-plein); opacity: 0.9; }
  .a4 .synthese-a4 { border: 1px solid #13457b66; border-radius: 2px; padding: 4px 8px; margin: 0 0 6px; font-size: 9.5pt; }
  .a4 .synthese-a4 b { color: #13457b; }
  .a4 .como-a4 { margin: 3px 0; }
  .a4 .como-a4 > b { font-weight: 600; color: #444; display: block; margin-bottom: 1px; }
  .a4 .como-a4 .grille { padding-left: 10px; }
  .a4 .como-a4 .ligne b { min-width: 46%; font-weight: 400; color: #555; }
  .a4 .a-conf { color: #13457b; font-size: 8.5pt; }
  .a4 table.plan-a4 { width: 100%; border-collapse: collapse; font-size: 9.5pt; margin: 3px 0; }
  .a4 table.plan-a4 th { text-align: left; font-size: 8.5pt; color: #555; font-weight: 600; border-bottom: 1px solid #999; padding: 2px 4px; }
  .a4 table.plan-a4 td { border-bottom: 1px solid #ddd; padding: 3px 4px; vertical-align: top; }
  .a4 .jeune-a4 { font-size: 10.5pt; }
  /* ===================== V2 ===================== */
  .sauve .long { display: inline; }
  @media (max-width: 1599px) { .sauve .long { display: none; } }
  .recherche { flex: 1 1 200px; max-width: 520px; }
  @media (max-width: 1499px) { .recherche kbd { display: none; } .barre { gap: var(--e3); } .nav button { padding-inline: 10px; } }
  .module-ad, .ad-corps, .prop, .para { grid-template-columns: minmax(0, 1fr); }
  .module-ad > *, .ad-corps > *, .prop > *, .prop-corps > *, .para > * { min-width: 0; }
  .params .rang-p { display: grid; grid-template-columns: minmax(0, 1fr); gap: 3px; }
  .params select { width: 100%; text-overflow: ellipsis; }
  .params input { justify-self: start; }
  .ic-sm svg, svg.ic-sm { width: 14px; height: 14px; }
  .etiquette { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; border: 1px dashed currentColor; color: var(--appl); white-space: nowrap; }
  .etiquette.plein { border-style: solid; background: var(--appl); color: var(--sur-appl); border-color: var(--appl); }
  .bandeau-apercu { display: flex; gap: var(--e2) var(--e3); align-items: center; flex-wrap: wrap; padding: 8px var(--e4); background: var(--coton-2); color: var(--encre-2); font-size: var(--t-s); border-bottom: 1px dashed var(--appl-trace); }
  .bandeau-apercu b { color: var(--encre); }
  .bandeau-apercu svg { width: 16px; height: 16px; flex: none; color: var(--appl); }

  /* Module d'aide à la décision : un appliqué faufilé (bâti en tirets), pas encore cousu. */
  .module-ad { position: relative; background: var(--papier); border-radius: var(--r); box-shadow: var(--ombre); display: grid; min-width: 0; }
  .module-ad::before { content: ""; position: absolute; inset: 4px; border: 1.5px dashed var(--appl-trace); border-radius: 7px; pointer-events: none; }
  .module-tete { display: grid; gap: 2px; padding: 12px 16px 8px; border-bottom: 1px dashed var(--appl-trace); }
  .module-titre { display: flex; align-items: center; gap: var(--e2); flex-wrap: wrap; }
  .module-titre h3 { font-size: var(--t-s); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--appl); }
  .module-titre .espace { min-width: 4px; }
  .module-meta { font-size: var(--t-xs); color: var(--encre-3); margin: 0; }
  .module-meta a, .lien-ad { color: var(--appl); font-weight: 600; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; cursor: pointer; background: none; border: 0; padding: 0; font-size: inherit; }
  .ad-onglets { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--filet); overflow-x: auto; scrollbar-width: none; }
  .ad-onglets button { border: 0; background: transparent; padding: 9px 10px 7px; cursor: pointer; color: var(--encre-2); font-weight: 600; font-size: var(--t-s); border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .ad-onglets button:hover { color: var(--appl); }
  .ad-onglets button[aria-selected="true"] { color: var(--appl); border-bottom-color: var(--appl); }
  .ad-onglets .n { font-family: var(--chiffres); font-size: 11px; min-width: 18px; padding: 0 5px; border-radius: 999px; border: 1px dashed var(--appl); color: var(--appl); text-align: center; line-height: 16px; }
  .ad-onglets .n.zero { border-style: solid; border-color: var(--filet); color: var(--encre-3); }
  .ad-corps { padding: 12px 14px 14px; display: grid; gap: var(--e3); min-width: 0; }
  .ad-note { margin: 0; font-size: var(--t-xs); color: var(--encre-3); }
  .ad-vide { margin: 0; font-size: var(--t-s); color: var(--encre-2); padding: 6px 0; }

  .prop { position: relative; border: 1.5px dashed var(--appl-trace); border-radius: var(--r-s); padding: 10px 12px; display: grid; gap: 8px; min-width: 0; background: var(--papier); }
  .prop.acceptee, .prop.modifiee { border-style: solid; border-color: var(--appl); background: color-mix(in srgb, var(--appl-voile) 45%, var(--papier)); }
  .prop.refusee { border-style: solid; border-color: var(--filet); background: var(--coton); }
  .prop.refusee .prop-corps { opacity: 0.7; }
  .prop-tete { display: flex; align-items: baseline; gap: 4px var(--e2); flex-wrap: wrap; }
  .prop-tete h4 { margin: 0; font-size: var(--t-m); font-weight: 700; }
  .prop-tete .sous-lib { font-size: var(--t-xs); color: var(--encre-2); }
  .prop-tete .espace { flex: 1; }
  .prop-corps { display: grid; gap: 6px; min-width: 0; }
  .prop-cle { display: grid; gap: 1px; padding: 8px 10px; border-radius: var(--r-s); background: var(--appl-voile); }
  .prop-cle .lib { font-size: var(--t-xs); font-weight: 600; color: var(--appl-fonce); text-transform: uppercase; letter-spacing: 0.06em; }
  :root[data-theme="dark"] .prop-cle .lib { color: var(--encre-2); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .prop-cle .lib { color: var(--encre-2); } }
  .prop-cle b { font-size: var(--t-l); font-weight: 700; color: var(--encre); }
  .prop-cle .date { font-size: var(--t-s); color: var(--encre); }
  .prop-cle .att { font-size: var(--t-xs); font-weight: 600; color: var(--vigil); }
  .prop-lignes { display: grid; grid-template-columns: minmax(84px, 118px) minmax(0, 1fr); gap: 4px var(--e3); margin: 0; font-size: var(--t-s); }
  .prop-lignes dt { color: var(--encre-3); font-size: var(--t-xs); font-weight: 600; padding-top: 1px; }
  .prop-lignes dd { margin: 0; color: var(--encre); min-width: 0; overflow-wrap: anywhere; }
  .prop-lignes dd small { color: var(--encre-3); font-size: var(--t-xs); }
  .manquant { color: var(--vigil); font-weight: 600; }
  .manquant-liste { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
  .manquant-liste li::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1.5px dashed var(--vigil); margin-right: 6px; vertical-align: 1px; }
  .en-regard { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
  .en-regard > div { padding: 7px 9px; border-radius: var(--r-s); font-size: var(--t-s); display: grid; gap: 2px; align-content: start; min-width: 0; }
  .en-regard .saisie-ex { background: var(--coton); }
  .en-regard .propo-ex { background: var(--appl-voile); }
  .en-regard .lib { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--encre-3); }
  .en-regard .propo-ex .lib { color: var(--appl); }
  .en-regard small { color: var(--encre-3); font-size: var(--t-xs); }
  .ecart { font-size: var(--t-xs); font-weight: 600; color: var(--vigil); grid-column: 1 / -1; display: flex; gap: 6px; align-items: flex-start; }
  .ecart svg { width: 14px; height: 14px; flex: none; margin-top: 1px; }
  @media (max-width: 520px) { .en-regard { grid-template-columns: minmax(0, 1fr); } }
  .params { display: grid; gap: 6px; padding: 8px 10px; border-radius: var(--r-s); border: 1px dashed var(--vigil); }
  .params .lib { font-size: var(--t-xs); font-weight: 600; color: var(--encre-2); }
  .params select, .params input { min-height: 32px; padding: 4px 8px; border: 1px solid var(--filet); border-radius: var(--r-s); background: var(--papier); max-width: 100%; font-size: var(--t-s); }
  .params select:focus, .params input:focus { border-color: var(--appl); outline: 1.5px dashed var(--appl); outline-offset: 3px; }
  .params .rang-p { display: flex; gap: 6px var(--e3); align-items: center; flex-wrap: wrap; }
  .prop-actions { display: flex; gap: var(--e2); flex-wrap: wrap; align-items: center; }
  .prop-actions .espace { flex: 1; }
  .choix-fait { margin: 0; display: flex; flex-wrap: wrap; gap: 4px var(--e2); align-items: center; font-size: var(--t-xs); color: var(--encre-2); }
  .choix-fait b { color: var(--encre); }
  .motif-refus { display: grid; gap: 6px; padding: 8px 10px; border-radius: var(--r-s); background: var(--coton); }
  .motif-refus label { font-size: var(--t-xs); font-weight: 600; color: var(--encre-2); }
  .motif-refus textarea, .modif-zone textarea, .modif-zone input { width: 100%; min-height: 36px; padding: 6px 9px; border: 1px solid var(--filet); border-radius: var(--r-s); background: var(--papier); font-size: var(--t-s); }
  .motif-refus textarea:focus, .modif-zone textarea:focus, .modif-zone input:focus { border-color: var(--appl); outline: 1.5px dashed var(--appl); outline-offset: 3px; }
  .modif-zone { display: grid; gap: 6px; padding: 8px 10px; border-radius: var(--r-s); background: var(--appl-voile); }
  .modif-zone .rang-p { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: var(--t-s); }
  .modif-zone input.jours { width: 72px; font-family: var(--chiffres); }
  .etat.acceptee { background: var(--appl-plein); color: var(--sur-plein); }
  .etat.modifiee { background: var(--appl-plein); color: var(--sur-plein); }
  .etat.refusee { background: var(--coton-2); color: var(--encre-2); border: 1px solid var(--filet); }
  .etat.attente { background: transparent; border: 1px dashed var(--appl); color: var(--appl); }
  .etat.attente::before { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
  .etat.revoir { background: var(--vigil-voile); color: var(--vigil); }
  .hors-regle { font-size: var(--t-xs); color: var(--encre-3); margin: 0; }

  /* D-02 : brouillon cité phrase par phrase */
  .brouillon { display: flex; gap: var(--e2) var(--e3); align-items: flex-start; flex-wrap: wrap; padding: 8px 10px; border-radius: var(--r-s); background: var(--appl-voile); color: var(--appl-fonce); font-size: var(--t-s); font-weight: 600; outline: 1.5px dashed var(--appl-trace); outline-offset: -4px; }
  :root[data-theme="dark"] .brouillon { color: var(--encre); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brouillon { color: var(--encre); } }
  .brouillon svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
  .brouillon span { font-weight: 400; color: var(--encre-2); display: block; font-size: var(--t-xs); }
  .informe { display: flex; gap: var(--e2); align-items: flex-start; font-size: var(--t-s); font-weight: 600; padding: 8px 10px; border-radius: var(--r-s); background: var(--coton); }
  .informe input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--appl); flex: none; }
  .informe small { display: block; font-weight: 400; color: var(--encre-2); font-size: var(--t-xs); }
  .para { display: grid; gap: 6px; padding: 10px 12px; border-radius: var(--r-s); border: 1.5px dashed var(--appl-trace); }
  .para.acceptee, .para.modifiee { border-style: solid; border-color: var(--appl); background: color-mix(in srgb, var(--appl-voile) 45%, var(--papier)); }
  .para.refusee { border-style: solid; border-color: var(--filet); background: var(--coton); }
  .para.refusee .para-texte { text-decoration: line-through; text-decoration-color: var(--encre-3); color: var(--encre-3); }
  .para-tete { display: flex; gap: var(--e2); align-items: baseline; flex-wrap: wrap; }
  .para-tete h4 { margin: 0; font-size: var(--t-s); font-weight: 700; }
  .para-tete .espace { flex: 1; }
  .para-texte { margin: 0; font-size: var(--t-m); line-height: 1.55; }
  .phrase { margin-right: 4px; }
  .puce-src {
    display: inline-flex; align-items: center; gap: 3px; vertical-align: 1px; margin: 0 2px; padding: 0 6px; min-height: 20px; border-radius: 999px;
    border: 1px dashed var(--appl); background: var(--papier); color: var(--appl); font-size: 11px; font-weight: 600; cursor: pointer; line-height: 1.5; font-family: var(--texte);
  }
  .puce-src:hover { border-style: solid; background: var(--appl-voile); }
  .puce-src[aria-expanded="true"] { background: var(--appl); color: var(--sur-appl); border-style: solid; }
  .src-detail { display: grid; gap: 3px; padding: 8px 10px; border-radius: var(--r-s); background: var(--coton); font-size: var(--t-s); border-left: 0; }
  .src-detail .lib { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--appl); }
  .src-detail q { font-style: normal; }
  .src-detail small { color: var(--encre-3); font-size: var(--t-xs); }
  .ecartees { margin: 0; font-size: var(--t-xs); color: var(--encre-3); }
  .ecartees b { color: var(--encre-2); }

  /* D-04 : scores */
  .score-tete { display: flex; align-items: baseline; gap: 4px var(--e3); flex-wrap: wrap; }
  .score-val { font-family: var(--chiffres); font-size: var(--t-2xl); font-weight: 600; line-height: 1; color: var(--encre); }
  .score-val small { font-size: var(--t-s); color: var(--encre-3); font-weight: 400; }
  .score-interp { font-size: var(--t-s); font-weight: 600; }
  .items { display: grid; gap: 3px; margin: 0; padding: 0; list-style: none; }
  .items li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; padding: 4px 6px; border-radius: 4px; font-size: var(--t-s); }
  .items li:nth-child(odd) { background: var(--coton); }
  .items .pt { font-family: var(--chiffres); font-weight: 600; text-align: center; border-radius: 4px; }
  .items .pt.un { background: var(--appl); color: var(--sur-appl); }
  .items .pt.zero { color: var(--encre-3); border: 1px solid var(--filet); }
  .items .pt.manque { color: var(--vigil); border: 1.5px dashed var(--vigil); }
  .items .it-src { grid-column: 2 / 3; font-size: var(--t-xs); color: var(--encre-3); }
  .items .it-act { grid-row: 1 / span 2; grid-column: 3; display: inline-flex; gap: 3px; }
  .items .it-act button { border: 1px solid var(--filet); background: var(--papier); border-radius: 4px; padding: 1px 7px; font-size: var(--t-xs); cursor: pointer; color: var(--encre-2); min-height: 26px; }
  .items .it-act button:hover { border-color: var(--appl); color: var(--appl); }
  .items .it-act button[aria-pressed="true"] { background: var(--appl); color: var(--sur-appl); border-color: var(--appl); }
  .licence { margin: 0; display: flex; gap: 6px; align-items: flex-start; font-size: var(--t-xs); color: var(--encre-2); padding: 6px 8px; border-radius: var(--r-s); background: var(--coton); }
  .licence svg { width: 14px; height: 14px; flex: none; margin-top: 1px; color: var(--encre-3); }

  /* D-03 : tri vert, orange, rouge (signal, jamais un choix) */
  .tri { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-xs); font-weight: 700; white-space: nowrap; }
  .tri::before { content: ""; width: 11px; height: 11px; border-radius: 50%; background: currentColor; flex: none; }
  .tri.vert { color: var(--ok); } .tri.orange { color: var(--vigil); } .tri.rouge { color: var(--rappel); }
  .tri.provisoire::before { background: transparent; box-shadow: inset 0 0 0 2.5px currentColor; }
  .tri-cell { display: grid; gap: 2px; min-width: 0; }
  .tri-motif { font-size: var(--t-xs); color: var(--encre-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
  .orient { font-size: var(--t-xs); color: var(--encre-2); }
  .orient b { color: var(--encre); font-weight: 600; }
  .compteurs-tri { display: inline-flex; gap: var(--e3); align-items: center; flex-wrap: wrap; font-size: var(--t-s); color: var(--encre-2); }
  .compteurs-tri .tri { font-size: var(--t-s); }
  .compteurs-tri .num { font-weight: 600; color: var(--encre); }
  tr.tri-detail td { background: var(--coton) !important; cursor: default; padding: 12px 14px; }
  tr.tri-detail:hover td { background: var(--coton) !important; }
  .tri-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px var(--e4); margin: 0; padding: 0; list-style: none; font-size: var(--t-xs); }
  .tri-grille li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 0 6px; align-items: baseline; }
  .tri-grille .niv { font-family: var(--chiffres); font-weight: 600; text-align: center; border-radius: 4px; padding: 0 2px; }
  .niv.n1 { color: var(--encre-3); border: 1px solid var(--filet); }
  .niv.n2 { background: var(--vigil-voile); color: var(--vigil); }
  .niv.n3 { background: var(--rappel-voile); color: var(--rappel); }
  .niv.nr { border: 1.5px dashed var(--vigil); color: var(--vigil); }
  .tri-grille small { color: var(--encre-3); grid-column: 2; }
  .tri-detail-corps { display: grid; gap: var(--e3); }
  .tri-detail-pied { margin: 0; display: flex; flex-wrap: wrap; gap: var(--e2) var(--e4); align-items: center; font-size: var(--t-xs); color: var(--encre-3); }

  /* Questionnaire, documents en colonne */
  .q-etat { display: grid; gap: 3px; justify-items: start; }
  .q-etat .etat.recu { background: var(--ok-voile); color: var(--ok); }
  .q-etat .etat.points { background: var(--vigil-voile); color: var(--vigil); }
  .q-etat .etat.encours { background: var(--appl-voile); color: var(--appl); border: 1px dashed var(--appl); }
  .q-etat .etat.envoye { background: transparent; color: var(--appl); border: 1px dashed var(--appl); }
  .q-etat .etat.non-envoye { background: transparent; color: var(--encre-3); border: 1px dashed var(--filet); }
  .q-etat small { font-size: var(--t-xs); color: var(--encre-3); }
  .docs-cell { display: grid; gap: 3px; }
  .docs-cell > span { display: flex; gap: 6px; align-items: center; font-size: var(--t-xs); color: var(--encre-2); }
  .docs-cell .d-lib { min-width: 84px; }
  .importe { margin-left: 6px; }
  table.liste.programme-v2 td { vertical-align: top; }
  @media (max-width: 760px) {
    table.liste.programme-v2 thead { display: none; }
    table.liste.programme-v2, table.liste.programme-v2 tbody { display: block; }
    table.liste.programme-v2 tr { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px 10px; padding: 12px; border-bottom: 1px solid var(--filet); }
    table.liste.programme-v2 td { display: block; padding: 0; border: 0; min-width: 0; }
    table.liste.programme-v2 td:nth-child(n+3) { grid-column: 1 / -1; }
    table.liste.programme-v2 td[data-label]::before { content: attr(data-label); display: block; font-size: var(--t-xs); color: var(--encre-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
    table.liste.programme-v2 td:nth-child(1)::before, table.liste.programme-v2 td:nth-child(2)::before { display: none; }
    table.liste.programme-v2 tr.tri-detail { display: block; }
    .tri-motif { max-width: none; white-space: normal; }
  }

  /* Encart, import du programme */
  .encart { display: grid; gap: var(--e2); padding: 14px 18px; border-radius: var(--r); background: var(--papier); box-shadow: var(--ombre); outline: 1.5px dashed var(--appl-trace); outline-offset: -6px; }
  .encart-tete { display: flex; gap: var(--e2) var(--e3); align-items: baseline; flex-wrap: wrap; }
  .encart-tete h2 { font-size: var(--t-l); }
  .encart ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px var(--e4); font-size: var(--t-s); }
  .import { display: grid; gap: var(--e3); }
  .etapes-import { display: flex; gap: 4px var(--e3); flex-wrap: wrap; margin: 0; padding: 0; list-style: none; font-size: var(--t-xs); color: var(--encre-3); }
  .etapes-import li[aria-current="step"] { color: var(--appl); font-weight: 700; }
  .etapes-import li.fait { color: var(--encre-2); }
  .csv { overflow-x: auto; border-radius: var(--r-s); background: var(--coton); }
  .csv table { border-collapse: collapse; font-family: var(--chiffres); font-size: 12px; width: 100%; }
  .csv th, .csv td { padding: 5px 8px; text-align: left; border-bottom: 1px solid var(--filet); white-space: nowrap; }
  .csv th { color: var(--encre-2); font-weight: 600; }
  .apparie { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px var(--e3); }
  .apparie label { display: grid; gap: 3px; font-size: var(--t-xs); font-weight: 600; color: var(--encre-2); }
  .apparie label span { font-family: var(--chiffres); color: var(--encre); }
  .apparie select { min-height: 32px; padding: 4px 8px; border: 1px solid var(--filet); border-radius: var(--r-s); background: var(--papier); font-size: var(--t-s); }
  .apparie .propose { font-weight: 400; color: var(--encre-3); }
  .lignes-import { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: var(--t-s); }
  .lignes-import li { display: flex; flex-wrap: wrap; gap: 2px var(--e3); align-items: baseline; padding: 6px 10px; border-radius: var(--r-s); background: var(--coton); }
  .lignes-import small { color: var(--encre-3); font-size: var(--t-xs); }

  /* Ordonnance lue (V2-01) */
  .lecture-ordo { display: grid; gap: 6px; }
  .lo-ligne { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px var(--e2); align-items: center; padding: 7px 9px; border-radius: var(--r-s); background: var(--papier); border: 1px dashed var(--appl-trace); }
  .lo-ligne.validee { border-style: solid; border-color: var(--appl); }
  .lo-ligne.ecartee { opacity: 0.6; }
  .lo-ligne.ecartee .lo-nom { text-decoration: line-through; }
  .lo-nom { font-weight: 600; font-size: var(--t-s); }
  .lo-detail { grid-column: 1 / -1; font-size: var(--t-xs); color: var(--encre-2); display: flex; gap: 2px 10px; flex-wrap: wrap; }
  .lo-detail .douteux { color: var(--vigil); font-weight: 600; }
  .lo-actions { display: inline-flex; gap: 4px; }

  /* Micro de dictée (V2-07) */
  .micro { position: absolute; right: 6px; top: -2px; border: 0; background: transparent; color: var(--appl); cursor: pointer; padding: 2px 4px; border-radius: 4px; display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .micro svg { width: 14px; height: 14px; }
  .micro:hover { background: var(--appl-voile); }
  .champ:has(.marque-ras) .micro, .champ:has(.marque-repris) .micro { right: 140px; }

  /* SMS et courrier dans le panneau documents */
  .sms { display: grid; gap: 6px; padding: 8px; border-radius: var(--r); background: var(--coton); font-size: var(--t-xs); }
  .sms summary { cursor: pointer; font-weight: 700; color: var(--encre); font-size: var(--t-s); }
  .sms-msg { background: var(--papier); border-radius: 12px 12px 12px 3px; padding: 8px 10px; color: var(--encre); font-size: var(--t-xs); line-height: 1.4; box-shadow: var(--ombre); }
  .sms-ligne { display: grid; gap: 4px; padding-top: 4px; }
  .sms-ligne b { font-size: var(--t-xs); }

  /* Questionnaire côté patient : téléphone de 390 px */
  .qp-page { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--e5); justify-items: center; align-items: start; }
  @media (min-width: 1100px) { .qp-page { grid-template-columns: minmax(0, 360px) 390px; justify-content: center; } }
  .qp-cote { display: grid; gap: var(--e3); align-content: start; max-width: 420px; }
  .qp-cote h1 { font-size: var(--t-2xl); }
  .qp-cote p { margin: 0; color: var(--encre-2); font-size: var(--t-s); }
  .telephone { width: 390px; max-width: 100%; border-radius: 34px; padding: 10px; background: #0d1b2a; box-shadow: 0 2px 6px #0003, 0 18px 40px #0002; }
  .ecran-tel { border-radius: 26px; overflow: hidden; background: var(--papier); min-height: 700px; display: grid; grid-template-rows: auto 1fr; }
  .tel-barre { display: flex; justify-content: space-between; align-items: center; padding: 10px 18px 6px; font-family: var(--chiffres); font-size: 12px; color: var(--encre-2); background: var(--coton); }
  .tel-corps { padding: 18px 18px 22px; display: grid; gap: 14px; align-content: start; }
  .tel-corps h2 { font-size: var(--t-xl); line-height: 1.25; }
  .tel-corps p { margin: 0; font-size: var(--t-m); color: var(--encre-2); }
  .tel-sms { display: grid; gap: 8px; }
  .tel-bulle { background: var(--coton-2); border-radius: 16px 16px 16px 4px; padding: 10px 12px; font-size: var(--t-m); color: var(--encre); }
  .tel-bulle a, .tel-lien { color: var(--appl); font-weight: 700; text-decoration: underline; cursor: pointer; background: none; border: 0; padding: 0; font-size: inherit; text-align: left; }
  .tel-progres { height: 6px; border-radius: 999px; background: var(--coton-2); overflow: hidden; }
  .tel-progres i { display: block; height: 100%; background: var(--appl); border-radius: 999px; transition: width 200ms cubic-bezier(.16,1,.3,1); }
  .tel-compte { font-family: var(--chiffres); font-size: 12px; color: var(--encre-3); display: flex; justify-content: space-between; }
  .tel-corps .tel-q { font-size: var(--t-xl); font-weight: 700; line-height: 1.3; color: var(--encre); }
  .tel-sys { font-size: var(--t-xs); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--appl); }
  .tel-rep { display: grid; gap: 10px; }
  .tel-rep button { min-height: 52px; border-radius: 12px; border: 1.5px solid var(--filet); background: var(--papier); font-size: var(--t-l); font-weight: 600; cursor: pointer; color: var(--encre); }
  .tel-rep button:hover { border-color: var(--appl); color: var(--appl); }
  .tel-rep button[aria-pressed="true"] { background: var(--appl); border-color: var(--appl); color: var(--sur-appl); }
  .tel-nav { display: flex; justify-content: space-between; gap: var(--e2); }
  .tel-champ { display: grid; gap: 6px; }
  .tel-champ label { font-size: var(--t-s); font-weight: 600; color: var(--encre-2); }
  .tel-champ input, .tel-champ textarea { min-height: 48px; border-radius: 12px; border: 1.5px solid var(--filet); padding: 10px 12px; font-size: var(--t-l); background: var(--papier); }
  .tel-champ input:focus, .tel-champ textarea:focus { border-color: var(--appl); outline: 1.5px dashed var(--appl); outline-offset: 3px; }
  .tel-langues { display: grid; gap: 8px; }
  .tel-langues button { min-height: 48px; border-radius: 12px; border: 1.5px solid var(--filet); background: var(--papier); font-size: var(--t-m); font-weight: 600; cursor: pointer; text-align: left; padding: 0 14px; display: flex; justify-content: space-between; align-items: center; color: var(--encre); }
  .tel-langues button[aria-pressed="true"] { border-color: var(--appl); background: var(--appl-voile); color: var(--appl); }
  .tel-langues button:disabled { cursor: default; color: var(--encre-3); border-style: dashed; }
  .tel-recap { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .tel-recap li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--coton); font-size: var(--t-s); }
  .tel-recap li b { font-weight: 700; }
  .tel-recap li.nsp b { color: var(--vigil); }
  .tel-gros { min-height: 52px; border-radius: 12px; font-size: var(--t-l); width: 100%; }
  .assiste { display: flex; gap: var(--e2); align-items: center; padding: 6px 12px; background: var(--vigil-voile); color: var(--vigil); font-size: var(--t-xs); font-weight: 700; }
  .erreur-tel { color: var(--rappel); font-weight: 600; font-size: var(--t-s); }
  @media (max-width: 430px) { .telephone { padding: 0; border-radius: 0; background: transparent; box-shadow: none; } .ecran-tel { border-radius: var(--r); min-height: 0; box-shadow: var(--ombre); } }

  /* VPA */
  .vpa { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--e4); align-items: start; }
  @media (min-width: 1000px) { .vpa { grid-template-columns: 320px minmax(0, 1fr); } }
  .vpa-liste { list-style: none; margin: 0; padding: 0; background: var(--papier); border-radius: var(--r); box-shadow: var(--ombre); overflow: hidden; }
  .vpa-liste li button { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--filet); background: transparent; padding: 10px 14px; display: grid; gap: 2px; cursor: pointer; }
  .vpa-liste li:last-child button { border-bottom: 0; }
  .vpa-liste li button:hover { background: var(--appl-voile); }
  .vpa-liste li button[aria-current="true"] { background: var(--appl-voile); }
  .vpa-liste li button[aria-current="true"] .n { color: var(--appl); }
  .vpa-liste .n { font-weight: 700; }
  .vpa-liste small { font-size: var(--t-xs); color: var(--encre-2); }
  .changements { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .changements li { padding: 8px 10px; border-radius: var(--r-s); background: var(--coton); font-size: var(--t-s); display: grid; gap: 2px; }
  .changements li b { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--appl); }
  .changements li small { color: var(--encre-3); font-size: var(--t-xs); }
  .checklist { display: grid; gap: 8px; }
  .checklist label { display: flex; gap: var(--e2); align-items: flex-start; font-size: var(--t-m); font-weight: 600; padding: 8px 10px; border-radius: var(--r-s); background: var(--coton); cursor: pointer; }
  .checklist input { width: 20px; height: 20px; accent-color: var(--appl); margin: 1px 0 0; flex: none; }
  .checklist small { display: block; font-weight: 400; font-size: var(--t-xs); color: var(--encre-2); }
  .checklist .ko { color: var(--vigil); font-weight: 600; }
  .vpa-ok { display: flex; gap: var(--e2); align-items: center; color: var(--ok); font-weight: 700; }
  .vpa-ok svg { width: 18px; height: 18px; }

  /* Bloc (aperçu) */
  .bloc { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--e4); align-items: start; }
  @media (min-width: 1000px) { .bloc { grid-template-columns: 220px minmax(0, 1fr); } }
  .evts { display: grid; gap: 6px; align-content: start; }
  .evt-btn { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 6px; align-items: center; min-height: 44px; padding: 6px 10px; border-radius: var(--r-s); border: 1px solid var(--filet); background: var(--papier); cursor: pointer; text-align: left; font-weight: 600; color: var(--encre); }
  .evt-btn .rond { width: 18px; height: 18px; border-radius: 50%; border: 1.5px dashed var(--appl); }
  .evt-btn.fait { background: var(--coton); color: var(--encre-2); cursor: default; }
  .evt-btn.fait .rond { background: var(--appl); border-style: solid; }
  .evt-btn.suivant { border-color: var(--appl); background: var(--appl); color: var(--sur-appl); }
  .evt-btn.suivant .rond { border-color: var(--sur-appl); }
  .evt-btn .h { font-family: var(--chiffres); font-size: var(--t-s); font-weight: 400; }
  .frise-bloc { background: var(--papier); border-radius: var(--r); box-shadow: var(--ombre); padding: 12px 14px; overflow-x: auto; }
  .fb-grille { position: relative; min-width: 620px; padding-right: 28px; display: grid; grid-template-columns: 110px minmax(0, 1fr); }
  .fb-axe { grid-column: 2; position: relative; height: 22px; border-bottom: 1px solid var(--filet); font-family: var(--chiffres); font-size: 11px; color: var(--encre-3); }
  .fb-axe span { position: absolute; top: 2px; transform: translateX(-50%); }
  .fb-lib { font-size: var(--t-xs); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--encre-2); padding: 12px 8px 12px 0; border-bottom: 1px dashed var(--filet); display: flex; align-items: center; }
  .fb-rang { position: relative; min-height: 92px; border-bottom: 1px dashed var(--filet); }
  .fb-tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--filet); }
  .fb-evt { position: absolute; top: 8px; transform: translateX(-6px); display: grid; gap: 1px; max-width: 118px; font-size: 11px; line-height: 1.25; }
  .fb-evt::before { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--appl); box-shadow: 0 0 0 2px var(--papier); }
  .fb-evt.med::before { border-radius: 2px; transform: rotate(45deg); }
  .fb-evt b { font-family: var(--chiffres); font-weight: 600; color: var(--encre-2); }
  .fb-evt span { color: var(--encre); font-weight: 600; }
  .fb-evt.bas { top: 48px; }
  .med-rapide { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
