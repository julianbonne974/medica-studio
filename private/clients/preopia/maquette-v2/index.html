  .med-rapide input { min-height: 32px; padding: 4px 8px; border: 1px solid var(--filet); border-radius: var(--r-s); background: var(--papier); font-size: var(--t-s); width: 200px; max-width: 100%; }
  .sspi { display: grid; gap: var(--e3); }
  .criteres { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
  .criteres label { display: flex; gap: var(--e2); align-items: center; padding: 8px 10px; border-radius: var(--r-s); background: var(--coton); font-weight: 600; font-size: var(--t-s); cursor: pointer; }
  .criteres input { width: 18px; height: 18px; accent-color: var(--appl); }
  .notif { display: flex; gap: var(--e2); align-items: flex-start; padding: 10px 12px; border-radius: var(--r-s); background: var(--ok-voile); color: var(--ok); font-weight: 700; font-size: var(--t-s); }
  .notif svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
  .notif span { display: block; font-weight: 400; color: var(--encre-2); font-size: var(--t-xs); }
  .exceptions { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }

  /* Comorbidités par appareil (V1-02) ------------------------------------------ */
  function groupeDe(tok) {

        (incomplets.length ? pluriel(incomplets.length, "dossier incomplet", "dossiers incomplets") + ", détail ci-dessous. " : "") +

        h += '<div class="lot-confirm" id="lot-confirm"><p>' + pluriel(nDocs, "document") + " dans l'ordre du programme, Cardella puis Mamao, par heure : " +
          e(prets.map(function (c) { var p = P.patient(c.patient); return nomP(p) + " (" + DOCS.filter(function (d) { return c.docs[d.k] === "pret"; }).length + ")"; }).join(", ")) +
          '.</p><button type="button" class="btn plein" id="lot-confirmer" data-act="lot-confirmer">' + ic("coche") + "Confirmer l'impression</button>" +
          '<button type="button" class="btn" id="lot-annuler" data-act="lot-annuler">Annuler</button></div>';
      }
      if (incomplets.length) {
        h += '<div class="manques-lot" id="manques-lot"><h3>Manques avant impression <span>' + pluriel(incomplets.length, "dossier incomplet", "dossiers incomplets") + " · un manque ouvre la fiche sur le champ</span></h3><ul>";
        incomplets.forEach(function (c) {
          var p = P.patient(c.patient);
          h += "<li><b>" + e(nomP(p)) + "</b>" + DOCS.filter(function (d) { return c.docs[d.k] === "a-faire"; }).map(function (d) {
            var m = manques(c, d.k);
            return '<span><span class="m-doc">' + d.court + " : </span>" + (m.length ? liensManques(c, m) : '<button type="button" class="lien-manque" data-act="ouvrir-cs" data-id="' + c.id + '">à valider</button>') + "</span>";
          }).join("") + "</li>";
        });
        h += "</ul>";
        if (S.lot === "tous") {
          h += '<div class="confirme-manque" id="lot-confirme-tous"><p><b>Imprimer malgré les manques ?</b> ' + pluriel(incomplets.length, "dossier incomplet part", "dossiers incomplets partent") + " avec les prêts (" + pluriel(nDocs + nDocsInc, "document") + "). Les champs manquants s'imprimeront « non renseigné ».</p>" +
            '<button type="button" class="btn plein" id="lot-confirmer-tous" data-act="lot-confirmer-tous">' + ic("imprimante") + "Imprimer malgré les manques</button>" +
            '<button type="button" class="btn" id="lot-annuler-tous" data-act="lot-annuler">Annuler</button></div>';
        } else h += '<div><button type="button" class="btn petit pique" id="lot-tous" data-act="lot-tous">' + ic("imprimante") + "Imprimer aussi les dossiers incomplets</button></div>";
        h += "</div>";
      }
      h += "</section>";
    }
    var ncol = 6 + (triOn ? 1 : 0) + (lecture ? 0 : 1);
    sites.forEach(function (site) {
      var l = liste.filter(function (c) { return c.site === site; });
      if (!l.length) return;
      h += '<section aria-labelledby="t-site-' + site + '"><h2 class="section" id="t-site-' + site + '">' + site + ' <span class="compte"><b class="num">' + nPrets(l) + "</b> " + (nPrets(l) > 1 ? "prêts" : "prêt") + " sur " + l.length + "</span></h2>";
      h += '<div class="table-zone"><table class="liste programme-v2"><thead><tr><th scope="col">Heure</th><th scope="col">Patient</th><th scope="col">Intervention</th><th scope="col">Rappels</th>' +
        (triOn ? '<th scope="col">Tri <span class="etiquette" title="Aide à la décision, D-03">D-03</span></th>' : "") + (lecture ? "" : '<th scope="col">Questionnaire</th>') + '<th scope="col">Documents</th><th scope="col">En attente</th></tr></thead><tbody>';
      l.forEach(function (c) {
        var p = P.patient(c.patient), mo = motifAttente(c);
        h += '<tr data-act="ouvrir-cs" data-id="' + c.id + '"' + (etatDossier(c) === "imprime" ? ' class="tout-imprime"' : "") + ">" +
          '<td class="num" data-label="Heure">' + e(c.heure || "") + "</td>" +
          '<td><button type="button" class="lien" id="ouvrir-' + c.id + '" data-act="ouvrir-cs" data-id="' + c.id + '">' + e(nomP(p)) + "</button>" + (c.importe ? '<span class="etiquette importe">importé</span>' : "") + "<small>" + e(P.ageTexte(p.ddn, P.AUJOURDHUI)) + " · " + e(dnTxt(p)) + "</small></td>" +
          '<td data-label="Intervention">' + e(c.intervention) + (c.precision ? " · " + e(c.precision) : "") + "<small>" + e(c.chirurgien) + " · " + e(c.anesthesiste || "anesthésiste à préciser") + "</small></td>" +

          '<td data-label="En attente"><span class="motif-attente' + (mo.pret ? " pret" : "") + '">' + e(mo.txt) + "</span></td></tr>";
        if (triOn && S.triOuvert[c.id]) h += triDetail(c, ncol);
      });
      h += "</tbody></table></div></section>";
    });
    h += "</div>";
    var jour = P.consultations.filter(function (c) { return c.dateCs === P.AUJOURDHUI && c.dateInt !== P.DEMAIN && etatDossier(c) === "incomplet"; }).map(prep);
    h += '<section class="jour" aria-labelledby="t-jour"><h2 id="t-jour">Consultations du jour à compléter</h2><p class="sous">' + e(P.dateFr(P.AUJOURDHUI, true)) + "</p>";

    jour.forEach(function (c) {
      var p = P.patient(c.patient), a = avance(c), mo = motifAttente(c), t = triOn ? triCalc(c) : null, qi = qInfo(c);
      h += '<li><button type="button" class="lien" id="jour-' + c.id + '" data-act="ouvrir-cs" data-id="' + c.id + '">' + e(nomP(p)) + "</button>" +

        '<span class="motif-attente">' + e(mo.txt) + "</span></span></li>";

    return h;

  /* Vue : impression du lot -------------------------------------------------- */
  function vueLot() {
    var liste = demainListe();
    var prets = liste.filter(function (c) { return etatDossier(c) === "pret"; });
    var feuilles = [];
    if (prets.length) prets.forEach(function (c) { DOCS.forEach(function (d) { if (c.docs[d.k] === "pret") feuilles.push([c, d.k]); }); });
    else S.lotImprime.forEach(function (x) { feuilles.push([cs(x[0]), x[1]]); });

      '<span class="sous">' + (prets.length ? pluriel(feuilles.length, "document") + " prêts, " + pluriel(prets.length, "dossier") : pluriel(feuilles.length, "document") + " imprimés au dernier lot") + "</span><span class=\"espace\"></span>" +
      (prets.length && S.role !== "facturation" ? '<button type="button" class="btn plein" id="lot-imprimer-planche" data-act="lot-confirmer">' + ic("imprimante") + "Imprimer ces " + pluriel(feuilles.length, "document") + "</button>" : "") + "</div>";

  /* Vue : patients ------------------------------------------------------------ */

      '<td class="num">' + df(p.ddn) + "<small>" + e(P.ageTexte(p.ddn, P.AUJOURDHUI)) + "</small></td>" +

  function vuePatients() {
    var h = '<div class="page"><div class="titre-page"><h1>Patients</h1><p class="sous">' + pluriel(P.patients.length, "patient") + " · la recherche en haut reconnaît seule un DN, une date de naissance ou un nom</p>";

    P.patients.slice().sort(function (a, b) { return a.nom.localeCompare(b.nom); }).forEach(function (p) { h += lignePatient(p); });

  /* Création de consultation : l'acte d'abord (V1-01), profil (V1-14) ---------------- */
  function creationEtat(p) {
    if (!S.creation || S.creation.pId !== p.id) S.creation = { pId: p.id, acte: "", precision: "", profil: "", site: p.site || "Cardella", q: "" };
    return S.creation;
  }
  function puceActe(a, cr, id) {
    return '<button type="button" class="puce-acte" id="' + id + '" data-act="cr-acte" data-v="' + e(a.nom) + '" aria-pressed="' + (cr.acte === a.nom) + '">' + e(a.nom) + "</button>";
  }
  function resultatsActes(cr) {
    var q = String(cr.q || "").trim().toUpperCase();
    if (!q) return "";
    var l = P.actes.filter(function (a) { return a.nom.indexOf(q) >= 0; }).slice(0, 6);
    var h = l.map(function (a, i) { return puceActe(a, cr, "acte-r-" + i); }).join("");
    if (!l.some(function (a) { return a.nom === q; })) h += '<button type="button" class="puce-acte" id="acte-libre" data-act="cr-acte" data-v="' + e(q) + '" aria-pressed="' + (cr.acte === q) + '">« ' + e(q) + " »<small>acte hors catalogue</small></button>";
    return h;
  }
  function creationHtml(p) {
    var cr = creationEtat(p), d = derniere(p.id), ac = P.acte(cr.acte);
    var faux = { patient: p.id, intervention: cr.acte, dateCs: P.AUJOURDHUI, rasPose: {}, intubation: "", allergies: "", autresAllergies: "", mallampati: "", dtm: "", autorisation: "OUI" };
    var pa = profilAuto(faux), profil = cr.profil || pa.k;
    var h = '<section class="piece creation" id="creation" aria-labelledby="creation-t"><header><h2 id="creation-t" style="font:inherit">Nouvelle consultation</h2><span class="aide">l\'acte d\'abord, puis le profil</span></header><div class="corps">';
    h += '<div class="etape"><div class="etape-tete"><h3 id="t-acte">Acte</h3><span class="sous">les plus fréquents du site</span>' +
      '<div class="segment petit" role="group" aria-label="Site">' + ["Cardella", "Mamao"].map(function (s) { return '<button type="button" id="cr-site-' + s + '" data-act="cr-site" data-v="' + s + '" aria-pressed="' + (cr.site === s) + '">' + s + "</button>"; }).join("") + "</div></div>";
    h += '<div class="puces" role="group" aria-labelledby="t-acte">' + P.actesFrequents(cr.site, 8).map(function (a, i) { return puceActe(a, cr, "acte-" + i); }).join("") + "</div>";
    h += '<div class="acte-recherche"><div class="champ-r">' + ic("loupe") + '<label for="acte-q" class="sr">Rechercher un autre acte</label><input id="acte-q" data-cr="q" value="' + e(cr.q) + '" autocomplete="off" spellcheck="false" placeholder="Autre acte : rechercher ou saisir"></div></div>' +
      '<div class="acte-resultats" id="acte-resultats" aria-live="polite">' + resultatsActes(cr) + "</div></div>";
    if (cr.acte) {
      if (ac && ac.cote) {
        h += '<div class="etape"><div class="etape-tete"><h3 id="t-prec">Précision</h3><span class="sous">proposée par l\'acte</span></div><div class="puces" role="group" aria-labelledby="t-prec">' +
          P.COTE[ac.cote].map(function (v, i) { return '<button type="button" class="puce-acte" id="prec-' + i + '" data-act="cr-precision" data-v="' + e(v) + '" aria-pressed="' + (cr.precision === v) + '">' + e(v) + "</button>"; }).join("") + "</div></div>";
      }
      var regles = P.rappels(faux).filter(function (x) { return x.niveau === "info"; });
      if (regles.length) h += '<div class="consignes-acte">' + regles.map(function (x) {
        return '<div class="rappel info">' + ic("document") + '<div><span class="r-tete">' + e(x.titre) + ' <span class="regle" title="' + e(REGLES[x.titre] || "") + '">règle</span></span><p>' + e(x.detail) + "</p></div></div>";
      }).join("") + "</div>";
    }
    h += '<div class="etape"><div class="etape-tete"><h3 id="t-profil">Profil</h3><span class="note-regle">' +
      (cr.profil ? "choisi à la main" : pa.pourquoi ? "choisi d'après " + (pa.k === "pediatrie" ? "l'âge : " : "l'") + e(pa.pourquoi) : "profil par défaut") + "</span></div>" +
      '<div class="segment" role="group" aria-labelledby="t-profil">' + P.profils.map(function (x) { return '<button type="button" id="cr-profil-' + x.k + '" data-act="cr-profil" data-v="' + x.k + '" aria-pressed="' + (profil === x.k) + '">' + x.lib + "</button>"; }).join("") + "</div>" +
      '<p class="note-regle">Pédiatrie : autorisation d\'opérer et représentant légal. Obstétrique : grossesses et terme.</p></div>';

    return h + "</div></section>";
  }

      (S.role === "facturation" ? "" : '<th scope="col">Documents</th>') + "</tr></thead><tbody>";
    l.forEach(function (c) {
      h += '<tr data-act="ouvrir-cs" data-id="' + c.id + '"><td class="num"><button type="button" class="lien" id="cs-' + c.id + '" data-act="ouvrir-cs" data-id="' + c.id + '">' + df(c.dateCs) + "</button></td><td>" + e(c.intervention || "à préciser") + "</td>" +

    });
    var a = P.anterieures[p.id];
    if (a) h += '<tr><td class="num">' + df(a.date) + "</td><td>" + e(a.intervention) + '<small>dossier antérieur, repris de l\'ancienne base</small></td><td></td><td>' + e(a.anesthesiste) + "</td><td></td>" + (S.role === "facturation" ? "" : "<td></td>") + "</tr>";
    if (!l.length && !a) h += '<tr><td colspan="6"><div class="vide">' + P.motif(72) + "<p>Aucune consultation pour ce patient.</p></div></td></tr>";
    h += "</tbody></table></div></section></div>";

  /* Vue : nouveau patient (création en ligne) --------------------------------------- */
  function nvVide() { return { nom: "", prenom: "", nee: "", statut: "", ddn: "", sexe: "", dn: "", sansDn: false, couverture: "", tel: "", erreurs: {} }; }
  function nvDepuis(q) {
    var n = nvVide(); q = String(q || "").trim();
    if (!q) return n;
    var t = typeQ(q);
    if (t === "date de naissance") n.ddn = q;
    else if (t === "DN") n.dn = q.replace(/\D/g, "").slice(0, 7);
    else { var m = q.split(/\s+/); n.nom = m[0].toUpperCase(); n.prenom = m.slice(1).join(" "); }
    return n;
  }
  function isoDepuis(fr) {
    var m = String(fr || "").match(/^(\d{2})\/(\d{2})\/(\d{4})$/);

    if (P.rappels(c).some(function (x) { return x.titre === "Consigne éphédrine ajoutée"; })) h += '<div class="rappel info">' + ic("document") + '<div><span class="r-tete">Ajoutée d\'office aux consignes <span class="regle regle-aff" tabindex="0" data-texte="' + e(REGLES["Consigne éphédrine ajoutée"]) + '">règle</span></span><p>' + e(P.EPHEDRINE) + "</p></div></div>";
    if (P.estOphtalmo(c)) h += '<div class="rappel info">' + ic("document") + '<div><span class="r-tete">Feuille de consignes ophtalmologie <span class="regle regle-aff" tabindex="0" data-texte="' + e(REGLES["Consignes ophtalmologie"]) + '">règle</span></span><p>Elle remplace la feuille standard pour cette intervention.</p></div></div>';

  }

  /* Comorbidités (V1-02) */
  function comoTete(c, g, lecture) {
    var x = c.como[g.k], n = comoNombre(x);
    var cpt = n ? '<span class="compteur plein" title="' + pluriel(n, "élément coché", "éléments cochés") + '">' + n + "</span>" : x.ras ? '<span class="compteur ras">RAS</span>' : '<span class="compteur nr">non renseigné</span>';
    return '<h4 id="como-t-' + g.k + '">' + e(g.lib) + "</h4>" + cpt + '<span class="espace"></span>' +
      (x.pose && !lecture ? '<button type="button" class="marque-ras" data-act="como-confirmer" data-g="' + g.k + '" title="Confirmer le RAS posé par le bouton RAS 1re partie">RAS, à confirmer</button>' : "") +
      (lecture ? "" : '<button type="button" class="btn petit' + (x.ras ? "" : " pique") + '" id="como-ras-' + g.k + '" data-act="como-ras" data-g="' + g.k + '" aria-pressed="' + x.ras + '"' + (n ? ' disabled title="Des éléments sont cochés ou saisis dans ce groupe"' : "") + ' aria-label="RAS pour ' + e(g.lib) + '">RAS</button>');
  }
  function comoGroupe(c, g, lecture) {
    var x = c.como[g.k];
    var h = '<div class="como-groupe' + (x.pose ? " ras-pose fixe" : "") + '" id="como-' + g.k + '" role="group" aria-labelledby="como-t-' + g.k + '"><div class="como-tete">' + comoTete(c, g, lecture) + "</div>";
    if (g.tous.length) h += '<div class="cases">' + g.tous.map(function (it, i) {
      var aj = g.ajouts.indexOf(it) >= 0;
      return '<label class="case' + (aj ? " ajout" : "") + '"' + (aj ? ' title="Valeur d\'exemple absente de la liste FileMaker, à valider par l\'équipe"' : "") + '><input type="checkbox" id="como-' + g.k + "-" + i + '" data-como="' + g.k + '" data-v="' + e(it) + '"' + (itemCoche(x, it) ? " checked" : "") + (lecture ? " disabled" : "") + ">" + e(it) + "</label>";
    }).join("") + "</div>";
    if (!lecture || x.libre) h += '<label class="sr" for="como-libre-' + g.k + '">Autre, ' + e(g.lib) + '</label><input class="como-libre" id="como-libre-' + g.k + '" data-comolibre="' + g.k + '" value="' + e(x.libre) + '" placeholder="Autre, précisions" autocomplete="off"' + (lecture ? " readonly" : "") + ">";

  }
  function comoHtml(c, lecture) {
    return '<div class="como" id="como">' + GROUPES.map(function (g) { return comoGroupe(c, g, lecture); }).join("") + "</div>";
  }

  /* Voies aériennes (V1-05) : dessins schématiques faits pour la maquette */
  function mallampatiSvg(v) {
    var n = L.mallampati.indexOf(v) + 1, langue = [0, 45, 41, 34, 25][n];
    var s = '<svg viewBox="0 0 64 56" aria-hidden="true" focusable="false">' +
      '<path class="mv-fond" d="M6 28 C6 10 58 10 58 28 C58 46 6 46 6 28 Z"/>' +
      '<path class="mv-dur" d="M12 19 C22 12 42 12 52 19 C42 16 22 16 12 19 Z"/>' +
      '<path class="mv-trait" d="M12 20 C22 25 42 25 52 20"/>' +
      '<ellipse class="mv-gorge" cx="32" cy="35" rx="11" ry="9"/>';
    if (n <= 2) s += '<path class="mv-trait" d="M19 23 C17 30 17 36 19 42 M45 23 C47 30 47 36 45 42"/>';
    if (n === 1) s += '<path class="mv-trait" d="M24 25 C22 31 22 37 24 42 M40 25 C42 31 42 37 40 42"/>';
    if (n <= 2) s += '<path class="mv-trait" d="M29 24 L29 30 C29 34 35 34 35 30 L35 24"/>';
    if (n === 3) s += '<path class="mv-trait" d="M29 24 L29 27 M35 24 L35 27"/>';
    s += '<path class="mv-langue" d="M8 34 C14 ' + (langue - 2) + " 24 " + langue + " 32 " + langue + " C40 " + langue + " 50 " + (langue - 2) + ' 56 34 C54 44 44 48 32 48 C20 48 10 44 8 34 Z"/>' +
      '<path class="mv-langue-t" d="M8 34 C14 ' + (langue - 2) + " 24 " + langue + " 32 " + langue + " C40 " + langue + " 50 " + (langue - 2) + ' 56 34 C54 44 44 48 32 48 C20 48 10 44 8 34 Z"/>' +
      '<path class="mv-trait" d="M6 28 C6 10 58 10 58 28 C58 46 6 46 6 28 Z"/></svg>';
    return s;
  }
  function dentsResume(c) {
    var l = [];
    DENTS.forEach(function (d) { var m = ["haut", "bas"].filter(function (x) { return c.dents[d[0]][x]; }); if (m.length) l.push(d[1].toLowerCase() + " " + (m.length === 2 ? "haut et bas" : m[0])); });
    if (l.length) return l.join(", ");
    return c.dents.ras ? "RAS" : "non renseigné";
  }
  function segmentSeuil(c, k, valeurs, lecture) {
    var vals = valeurs.slice(); if (c[k] && vals.map(function (x) { return x[0]; }).indexOf(c[k]) < 0) vals.push([c[k], c[k]]);
    return '<div class="segment" role="group" aria-labelledby="t-' + k + '" id="seg-' + k + '">' + vals.map(function (x, i) {
      return '<button type="button" id="' + k + "-" + i + '" data-act="seuil" data-k="' + k + '" data-v="' + e(x[0]) + '" aria-pressed="' + (c[k] === x[0]) + '"' + (lecture ? " disabled" : "") + ">" + e(x[1]) + "</button>";
    }).join("") + "</div>";
  }
  function intubationHtml(c, lecture) {
    var h = '<div class="sous-titre"><span id="t-mallampati">Mallampati</span><span id="mv-etat">' + (c.mallampati ? "classe " + e(c.mallampati) : "non renseigné") + "</span></div>";
    h += '<div class="mallampati" role="group" aria-labelledby="t-mallampati" id="ch-mallampati">' + L.mallampati.map(function (v) {
      return '<button type="button" class="vignette" id="mv-' + v + '" data-act="mallampati" data-v="' + v + '" aria-pressed="' + (c.mallampati === v) + '"' + (lecture ? " disabled" : "") + ' aria-label="Mallampati ' + v + '">' + mallampatiSvg(v) + "<b>" + v + "</b></button>";
    }).join("") + "</div>";
    h += '<div class="seuils"><div class="champ" id="ch-dtm"><span class="lib" id="t-dtm">DTM (cm)</span>' + segmentSeuil(c, "dtm", [["< 7", "< 7"], ["> 7", "> 7"]], lecture) + "</div>" +
      '<div class="champ" id="ch-ouverture"><span class="lib" id="t-ouverture">Ouverture de bouche</span>' + segmentSeuil(c, "ouverture", [["NON LIMITEE", "Non limitée"], ["LIMITEE", "Limitée"]], lecture) + "</div></div>";
    var nd = DENTS.some(function (d) { return c.dents[d[0]].haut || c.dents[d[0]].bas; });
    h += '<div class="sous-titre"><span id="t-dents">Dents</span><span><span id="dents-etat">' + e(dentsResume(c)) + "</span>" +
      (lecture ? "" : ' <button type="button" class="btn petit' + (c.dents.ras ? "" : " pique") + '" id="dents-ras" data-act="dents-ras" aria-pressed="' + !!c.dents.ras + '"' + (nd ? " disabled" : "") + ">RAS</button>") + "</span></div>" +
      '<div class="dents" role="group" aria-labelledby="t-dents" id="ch-dents"><span></span><span class="d-tete">Haut</span><span class="d-tete">Bas</span>' + DENTS.map(function (d) {
        return '<span class="d-lib">' + d[1] + "</span>" + ["haut", "bas"].map(function (m) {
          return '<label class="d-case"><input type="checkbox" id="dent-' + d[0] + "-" + m + '" data-dent="' + d[0] + '" data-m="' + m + '"' + (c.dents[d[0]][m] ? " checked" : "") + (lecture ? " disabled" : "") +
            ' aria-label="' + d[1] + ", mâchoire " + (m === "haut" ? "haute" : "basse") + '"></label>';
        }).join("");
      }).join("") + "</div>";
    h += champ(c, "intubation", lecture);
    return h;
  }

  /* Plan « continuer sauf » (V1-08) */
  function dpTexte(c, x) {
    var dp = dernierePrise(c, x.jours);
    if (dp) return { txt: "dernière prise le " + dp.txt + " (J-" + dp.j + ")", ok: true };
    if (!c.dateInt) return { txt: "date d'intervention à saisir pour calculer la dernière prise", ok: false };
    return { txt: "durée à saisir, en jours", ok: false };
  }
  function planHtml(c, lecture) {
    var l = traitementsListe(c), nm = planManques(c).length;
    var h = '<div class="plan" id="plan"><div class="sous-titre"><span id="t-plan">Traitements : continuer, sauf arrêt saisi</span><span>' + (l.length ? (nm ? pluriel(nm, "consigne à confirmer", "consignes à confirmer") : "plan complet") : "") + "</span></div>";
    if (!l.length) h += '<p class="vide-petit">' + (rempli(c, "traitements") ? "Pas de traitement en cours." : "Traitements non renseignés.") + "</p>";
    l.forEach(function (t, i) {

        (x.regle ? "<small>proposition D-01 " + e(x.regle.statut) + "</small>" : "") + (po ? '<span class="note-regle" style="display:block;font-weight:400">' + e(po) + " (ordonnance lue)</span>" : "") + "</span>" +
        '<div class="segment petit" role="group" aria-label="Consigne pour ' + e(t) + '">' +
        '<button type="button" id="plan-c-' + i + '" data-act="plan" data-t="' + e(t) + '" data-v="continuer" aria-pressed="' + (x.confirme && x.choix === "continuer") + '"' + dis + ">Continuer</button>" +
        '<button type="button" id="plan-a-' + i + '" data-act="plan" data-t="' + e(t) + '" data-v="arreter" aria-pressed="' + (x.choix === "arreter") + '"' + dis + ">Arrêter</button></div>";
      if (x.choix === "arreter") {
        var dp = dpTexte(c, x);
        h += '<div class="plan-arret"><label for="plan-j-' + i + '">Jours sans prise avant le jour J</label><input id="plan-j-' + i + '" data-planj="' + e(t) + '" data-i="' + i + '" inputmode="numeric" maxlength="3" value="' + e(x.jours) + '" autocomplete="off"' + (lecture ? " readonly" : "") + ">" +
          '<span class="derniere-prise' + (dp.ok ? "" : " nr") + '" id="plan-dp-' + i + '" aria-live="polite">' + e(dp.txt) + "</span></div>";
      }
      if (x.regle) h += '<p class="note-regle" style="grid-column:1/-1;margin:0">' + e(x.regle.texte) + " · règle : " + e(x.regle.src) + ", " + e(x.regle.version) + " · " + e(x.regle.qui) + "</p>";
      h += "</div>";
    });
    if (nm && !lecture && l.some(function (t) { return !planDe(c, t).confirme; })) h += '<div class="plan-pied"><button type="button" class="btn petit pique" id="plan-autres" data-act="plan-autres">Continuer tous les autres</button><span>Aucune durée d\'arrêt n\'est proposée par le logiciel.</span></div>';
    return h + "</div>";
  }

  /* Jeûne en heures (V1-09) */
  function jeuneHtml(c) {
    var j = jeune(c);
    var ligne = function (lib, x) {
      if (x.nr) return '<div class="jeune-ligne"><span>' + lib + '</span><b class="nr">' + e(x.nr) + "</b>" + (x.h != null ? "<small>" + hTxt(x.h) + " avant la convocation</small>" : "") + "</div>";
      return '<div class="jeune-ligne"><span>' + lib + "</span><b>avant " + x.heure + "</b><small>" + (x.veille ? "la veille, " : "") + (x.iso ? df(x.iso) + " · " : "") + hTxt(x.h) + " avant la convocation</small></div>";
    };
    return '<div class="jeune" id="jeune"><div class="sous-titre"><span>Jeûne</span><span>' + (c.convocation ? "calculé depuis la convocation à " + e(c.convocation) : "heure de convocation à saisir") + "</span></div>" +
      '<div class="jeune-lignes">' + ligne("Dernier repas", j.repas) + ligne("Dernière boisson claire", j.boisson) + "</div>" +
      '<p class="jeune-source">Délais : ' + (j.source ? "réglage d'équipe, valeurs d'exemple · " + e(j.source) : (j.repas.h == null && !R ? "aucun réglage d'équipe chargé dans la maquette" : "réglage d'équipe")) +
      (j.perimetre ? "<br>Périmètre du réglage : " + e(j.perimetre.replace(/\.$/, "")) : "") + "</p></div>";
  }

  function partieSecretaire(c, p) {
    var a = avance(c);
    var h = '<section class="moitie" aria-labelledby="t-secr"><h2 class="moitie-titre" id="t-secr"><span>Partie secrétaire</span><span class="num" id="av-secr">' + a.s + " / " + a.ts + "</span></h2>";
    var coud = '<div class="rang"><div class="saisie-bloc"><div class="champ"><label for="p-couverture">Couverture sociale</label><select id="p-couverture" data-pk="couverture"><option value="">à choisir</option>' +
      L.couverture.map(function (x) { return '<option value="' + e(x) + '"' + (p.couverture === x ? " selected" : "") + ">" + e(x) + "</option>"; }).join("") + "</select></div></div>" +
      '<div class="saisie-bloc"><div class="champ"><label for="p-tel">Téléphone</label><input id="p-tel" data-pk="tel" class="num" inputmode="tel" value="' + e(p.tel || "") + '" autocomplete="off"></div></div></div>';
    h += piece("pc-identite", "Identité", p.dn ? "DN " + e(p.dn) : "sans DN, couverture à préciser",

      (p.nee ? "<div><dt>Nom de naissance</dt><dd>" + e(p.nee) + "</dd></div>" : "") + "</dl>" + coud);

    var profil = '<div class="saisie-bloc"><span class="lib" id="t-profil-f" style="font-size:var(--t-xs);font-weight:600;color:var(--encre-2)">Profil de consultation</span>' +
      '<div class="segment" role="group" aria-labelledby="t-profil-f" id="ch-profil">' + P.profils.map(function (x) { return '<button type="button" id="profil-' + x.k + '" data-act="profil" data-v="' + x.k + '" aria-pressed="' + (c.profil === x.k) + '">' + x.lib + "</button>"; }).join("") + "</div>" +

    h += piece("pc-intervention", "Intervention", "", champ(c, "intervention") + champ(c, "precision") + rang(c, ["dateInt", "heure", "convocation"]) + rang(c, ["site", "chirurgien", "anesthesiste", "dateCs"]) + profil, boutonConfirmer(c, ["intervention"]));
    var rp = regleAffichage(c, "pediatrie");
    if (rp) {
      h += piece("pc-pediatrie", "Pédiatrie", "", '<label class="ligne-case" for="f-autorisation"><input type="checkbox" id="f-autorisation" data-chk="autorisation"' + (rempli(c, "autorisation") ? " checked" : "") + ">Autorisation d'opérer des parents recueillie</label>" + champ(c, "representant"), regleAff(rp));
    }
    h += piece("pc-constantes", "Constantes", "IMC calculé", rang(c, ["poids", "taille", "imc", "ta", "pouls"], false, "cinq") + '<div class="bornes" id="bornes" aria-live="polite">' + bornesHtml(c) + "</div>");
    h += piece("pc-allergies", "Allergies", "préciser le type de réaction", champ(c, "allergies") + champ(c, "autresAllergies"), boutonConfirmer(c, ["allergies", "autresAllergies"]));

      '<p class="note-regle" style="margin:0">Avertissement seulement, la saisie est gardée · ' + e(bornes().source) + "</p>";

  function piecesMedecin(c, p, lecture) {

      rang(c, ["ecg", "rx"], lecture) + rang(c, ["echo", "efr"], lecture) + champ(c, "autresExamens", lecture), boutonConfirmer(c, ["signes", "cardio", "souffle", "pulmo"], lecture));

  function chronoPiece(c) {

  function partieMedecin(c, p) {

        "<p>" + a.m + " rubriques sur " + a.tm + " remplies par l'anesthésiste. Antécédents, examen, intubation, conclusion et consignes se complètent au poste médecin.</p>" +

    if (ev.key === "Escape" && !edit && S.vue === "consultation" && S.apercu && !S.modele) { S.apercu = null; S.confirmeImp = false; rendre(); }
  });
  window.addEventListener("resize", function () { majHauteurs(); });
  var rafCompacte = 0;
  window.addEventListener("scroll", function () { if (rafCompacte) return; rafCompacte = requestAnimationFrame(function () { rafCompacte = 0; majCompacte(); }); }, { passive: true });

  /* Thème ---------------------------------------------------------------------------------------- */
  var THEMES = [["", "automatique"], ["light", "clair"], ["dark", "sombre"]], iTheme = 0;
  function basculerTheme() {
    iTheme = (iTheme + 1) % THEMES.length;
    if (THEMES[iTheme][0]) document.documentElement.setAttribute("data-theme", THEMES[iTheme][0]); else document.documentElement.removeAttribute("data-theme");
    $("#theme-bascule").textContent = "Thème : " + THEMES[iTheme][1];
  }

  /* Chronomètre et compteur de clics ---------------------------------------------------------- */
  var CHR = { marche: false, debut: 0, ecoule: 0, clics: 0, t: null, res: {} };
  function tempsTxt(ms) { var s = ms / 1000, m = Math.floor(s / 60), r = s - m * 60; return m + ":" + (r < 10 ? "0" : "") + r.toFixed(1).replace(".", ","); }
  function majChrono() {
    var ms = CHR.ecoule + (CHR.marche ? Date.now() - CHR.debut : 0);
    $("#chrono-temps").textContent = tempsTxt(ms);
    $("#chrono-clics").textContent = pluriel(CHR.clics, "clic");
  }
  function basculerChrono() {
    var ch = $("#chrono"), b = $("#chrono-bascule");
    ch.hidden = !ch.hidden; b.setAttribute("aria-pressed", String(!ch.hidden));
  }
  function chronoGo() {
    var b = $("#chrono-go");
    if (!CHR.marche) { CHR.marche = true; CHR.debut = Date.now(); CHR.t = setInterval(majChrono, 100); b.textContent = "Arrêter"; }
    else {
      CHR.marche = false; CHR.ecoule += Date.now() - CHR.debut; clearInterval(CHR.t); b.textContent = "Reprendre";
      var sc = $("#chrono-scenario"); CHR.res[sc.value] = { ms: CHR.ecoule, clics: CHR.clics, nom: sc.options[sc.selectedIndex].text };
      $("#chrono-res").innerHTML = Object.keys(CHR.res).sort().map(function (k) { var x = CHR.res[k]; return "<span>" + e(x.nom) + " : " + tempsTxt(x.ms) + ", " + pluriel(x.clics, "clic") + "</span>"; }).join("");
    }
    majChrono();
  }
  function chronoZero() {
    CHR.marche = false; clearInterval(CHR.t); CHR.ecoule = 0; CHR.clics = 0; $("#chrono-go").textContent = "Démarrer"; majChrono();
  }
  document.addEventListener("click", function (ev) {
    if (CHR.marche && !ev.target.closest("#chrono") && ev.target.id !== "chrono-bascule") { CHR.clics++; majChrono(); }
  }, true);

  /* Démarrage ------------------------------------------------------------------------------------- */
  $("#marque-motif").outerHTML = P.motif(26);
  $("#loupe").outerHTML = ic("loupe");
  $("#chrono-ico").outerHTML = ic("chrono");
  $("#listes").innerHTML = Object.keys(CH).filter(function (k) { return CH[k].liste; }).map(function (k) {
    return '<datalist id="l-' + k + '">' + CH[k].liste.map(function (v) { return '<option value="' + e(v) + '"></option>'; }).join("") + "</datalist>";
  }).join("");
  S.derniereSynchro = heureTahiti();
  etatSauve("ok", "Enregistré sur ce poste · synchronisé à " + S.derniereSynchro);
  rendre();
})();
</script>
