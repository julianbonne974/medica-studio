<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preopia, maquette V1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="commun/tifaifai.css">
<style>
  [hidden] { display: none !important; }
  body { background: var(--coton); }
  main:focus { outline: none; }

  /* Bandeau de maquette */
  .lien-maquette {
    border: 0; background: transparent; color: var(--encre-2); cursor: pointer; padding: 2px 6px;
    font-size: var(--t-xs); border-radius: var(--r-s); text-decoration: underline; text-underline-offset: 3px;
  }
  .lien-maquette:hover { color: var(--appl); }
  .lien-maquette[aria-pressed="true"] { color: var(--appl); font-weight: 600; }
  .maquette .outils { display: flex; gap: var(--e2); flex-wrap: wrap; }

  /* Barre et recherche universelle */
  .marque .motif { width: 26px; height: 26px; }
  .recherche { position: relative; flex: 1 1 340px; max-width: 580px; min-width: 0; }
  .champ-r {
    display: flex; align-items: center; gap: var(--e2); min-height: 38px; padding: 0 10px;
    border: 1px solid var(--filet); border-radius: var(--r-s); background: var(--coton);
  }
  .champ-r:focus-within { border-color: var(--appl); background: var(--papier); box-shadow: 0 0 0 3px var(--papier), 0 0 0 4px var(--appl-trace); }
  .champ-r svg { width: 16px; height: 16px; color: var(--encre-3); flex: none; }
  .champ-r input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; padding: 7px 0; }
  .champ-r input::placeholder { color: var(--encre-3); }
  .type-r { font-size: var(--t-xs); color: var(--appl); font-weight: 600; white-space: nowrap; }
  kbd {
    font-family: var(--chiffres); font-size: var(--t-xs); color: var(--encre-2); background: var(--papier);
    border: 1px solid var(--filet); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; white-space: nowrap;
  }
  .deroulant {
    position: absolute; top: calc(100% + 6px); left: 0; width: min(660px, calc(100vw - 32px)); z-index: 30;
    background: var(--papier); border-radius: var(--r); box-shadow: var(--ombre);
    padding: 6px; max-height: 72vh; overflow: auto;
  }
  .der-tete { padding: 6px 10px 8px; font-size: var(--t-xs); color: var(--encre-3); }
  .der-tete b { color: var(--appl); }
  .option {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--e3); padding: 8px 10px;
    border-radius: var(--r-s); cursor: pointer;
  }
  .option[aria-selected="true"], .option:hover { background: var(--appl-voile); }
  .option .o-nom { font-weight: 600; }
  .option .o-dn { font-family: var(--chiffres); font-size: var(--t-s); color: var(--encre-2); text-align: right; }
  .option .o-detail { grid-column: 1 / -1; font-size: var(--t-xs); color: var(--encre-2); }
  .option .o-va { font-size: var(--t-xs); color: var(--appl); text-align: right; }
  .option.nouveau { grid-template-columns: auto minmax(0, 1fr); align-items: center; border-top: 1px solid var(--filet); margin-top: 4px; padding-top: 10px; color: var(--appl); }
  .option.nouveau svg { width: 18px; height: 18px; }
  .option.nouveau small { display: block; color: var(--encre-3); font-size: var(--t-xs); }

  .restreint {
    display: flex; gap: var(--e2); align-items: center; padding: 8px var(--e4);
    background: var(--vigil-voile); color: var(--vigil); font-weight: 600; font-size: var(--t-s);
  }
  .restreint svg { width: 16px; height: 16px; flex: none; }
  .restreint span { font-weight: 400; color: var(--encre-2); }

  /* Pages */
  .page { padding: var(--e5) var(--e4) var(--e6); max-width: 1720px; margin: 0 auto; display: grid; gap: var(--e5); min-width: 0; }
  .titre-page { display: flex; align-items: baseline; gap: var(--e2) var(--e4); flex-wrap: wrap; }
  .titre-page h1 { font-size: var(--t-2xl); letter-spacing: -0.01em; }
  .titre-page .sous { color: var(--encre-2); margin: 0; }
  .titre-page .espace { min-width: 1px; }
  .sous { color: var(--encre-2); margin: 0; font-size: var(--t-s); }
  h2.section { font-size: var(--t-l); display: flex; align-items: baseline; gap: var(--e2); flex-wrap: wrap; margin-bottom: var(--e2); }
  .compte { font-weight: 400; color: var(--encre-3); font-size: var(--t-s); }
  .lien {
    border: 0; background: none; padding: 0; color: var(--encre); font-weight: 600; cursor: pointer; text-align: left;
    text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px;
  }
  .lien:hover { color: var(--appl); text-decoration-color: currentColor; }
  td small, .petit-gris { display: block; color: var(--encre-3); font-size: var(--t-xs); }
  table.liste td.num, table.liste .num { font-variant-numeric: tabular-nums; }
  tr.tout-imprime td { color: var(--encre-3); }

  /* Demain */
  .demain { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--e5); align-items: start; }
  @media (min-width: 1500px) { .demain { grid-template-columns: minmax(0, 1fr) 360px; } .jour { position: sticky; top: 72px; } }
  .programme { display: grid; gap: var(--e5); min-width: 0; }
  .demain > *, .programme > * { min-width: 0; }
  .lot {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--e3) var(--e4); align-items: center;
    padding: 18px 22px; border-radius: var(--r); background: var(--appl-voile);
    outline: 1.5px dashed var(--appl-trace); outline-offset: -7px;
  }
  .lot .motif { width: 46px; height: 46px; }
  .lot h2 { font-size: var(--t-l); }
  .lot p { margin: 3px 0 0; color: var(--encre-2); font-size: var(--t-s); }
  .lot-actions { display: flex; gap: var(--e2); flex-wrap: wrap; justify-content: flex-end; }
  .lot-confirm {
    grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--e2) var(--e3); align-items: center;
    padding-top: var(--e3); border-top: 1px dashed var(--appl-trace); font-size: var(--t-s);
  }
  .lot-confirm p { flex: 1 1 320px; margin: 0; color: var(--encre); }
  @media (max-width: 760px) { .lot { grid-template-columns: minmax(0, 1fr); } .lot .motif { display: none; } .lot-actions { justify-content: flex-start; } }
  .piece.replie > header { background: var(--coton-2); color: var(--encre-3); }
  .piece.replie > header .aide { color: var(--encre-3); opacity: 1; }
  @media (max-width: 700px) {
    table.liste.programme-jour thead { display: none; }
    table.liste.programme-jour, table.liste.programme-jour tbody { display: block; }
    table.liste.programme-jour tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; padding: 12px; border-bottom: 1px solid var(--filet); }
    table.liste.programme-jour td { display: block; padding: 0; border: 0; min-width: 0; }
    table.liste.programme-jour td:nth-child(1) { grid-column: 1 / 2; }
    table.liste.programme-jour td:nth-child(2) { grid-column: 2 / 4; }
    table.liste.programme-jour td:nth-child(3), table.liste.programme-jour td:nth-child(4), table.liste.programme-jour td:nth-child(5) { grid-column: 1 / -1; }
    table.liste.programme-jour td[data-label]::before { content: attr(data-label); display: block; font-size: var(--t-xs); color: var(--encre-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
    table.liste.programme-jour td:nth-child(1)::before, table.liste.programme-jour td:nth-child(2)::before { display: none; }
  }
  .pastilles { display: flex; flex-wrap: wrap; gap: 4px; }
  .pastille { font-size: var(--t-xs); font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--rappel-voile); color: var(--rappel); white-space: nowrap; }
  .pastille.vigil { background: var(--vigil-voile); color: var(--vigil); }
  .pastille.info { background: var(--appl-voile); color: var(--appl); }
  .pastille.neutre { background: var(--coton-2); color: var(--encre-2); }
  .aucun { color: var(--encre-3); font-size: var(--t-xs); }
  .jour h2 { font-size: var(--t-l); margin-bottom: 2px; }
  .jour .sous { margin-bottom: var(--e3); }
  .jour-liste { list-style: none; margin: 0; padding: 0; background: var(--papier); border-radius: var(--r); box-shadow: var(--ombre); }
  .jour-liste li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px var(--e3); padding: 12px 14px; border-bottom: 1px solid var(--filet); align-items: center; }
  .jour-liste li:last-child { border-bottom: 0; }
  .jour-liste .detail { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px var(--e3); align-items: center; font-size: var(--t-xs); color: var(--encre-2); }
  .jour-liste .vide { padding: var(--e5) var(--e4); }

  /* Consultation */
  .bandeau .lien-bandeau {
    display: inline-block; margin-top: 6px; border: 0; background: none; padding: 0; cursor: pointer;
    color: var(--sur-appl); font-size: var(--t-xs); text-decoration: underline; text-underline-offset: 3px; opacity: 0.9;
  }
  .bandeau :focus-visible { outline-color: var(--sur-appl); }
  @media (max-width: 600px) { .bandeau { grid-template-columns: 1fr 1fr; } .bandeau .nom { grid-column: 1 / -1; } }
  .cs-corps { display: grid; grid-template-columns: minmax(0, 1fr) 240px; align-items: start; }
  @media (min-width: 601px) { .bandeau { grid-template-columns: minmax(210px, 1.6fr) repeat(auto-fit, minmax(110px, 1fr)); } }
  .cs-zone { min-width: 0; }
  .fiche { --pli: 158px; }
  .moitie-titre { margin: 0; font-weight: 600; }
  .moitie-titre .num { letter-spacing: 0; text-transform: none; }
  .piece > header h3 { font: inherit; letter-spacing: inherit; }
  .saisie-bloc { display: grid; gap: 6px; min-width: 0; align-content: start; }
  .rang { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: var(--e3); }
  .rang.cinq { grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); }
  .champ input.num { font-family: var(--chiffres); font-variant-numeric: tabular-nums; }
  .champ textarea { min-height: 48px; }
  .marque-repris, .marque-garde {
    position: absolute; right: 6px; top: 0; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700;
  }
  .marque-repris { color: var(--encre-3); }
  .ras-pose.fixe::after { animation: none; }
  .garde { position: relative; }
  .garde::after {
    content: ""; position: absolute; inset: auto -5px -5px -5px; top: calc(1.2em + 4px - 5px);
    border: 1.5px dashed var(--vigil); border-radius: 9px; pointer-events: none;
  }
  .marque-garde { color: var(--vigil); }
  .ligne-case { display: flex; gap: var(--e2); align-items: center; font-size: var(--t-s); font-weight: 600; }
  .ligne-case input { width: 18px; height: 18px; accent-color: var(--appl); }
  .identite-liste { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px var(--e3); margin: 0; font-size: var(--t-s); }
  .identite-liste dt { font-size: var(--t-xs); color: var(--encre-3); }
  .identite-liste dd { margin: 0; font-weight: 600; }
  .valider { display: grid; gap: var(--e2); justify-items: start; padding-top: var(--e2); border-top: 1px dashed var(--appl-trace); }
  .valider p { margin: 0; font-size: var(--t-xs); color: var(--encre-2); }
  .replie .corps { gap: var(--e3); }
  .replie p { margin: 0; color: var(--encre-2); font-size: var(--t-s); }
  .lecture-seule .piece > header { background: var(--coton-2); color: var(--encre-2); }

  /* Ordonnance en photo */
  .ordo { display: grid; gap: var(--e2); padding: 10px; border-radius: var(--r-s); background: var(--coton); }
  .ordo-tete { display: flex; gap: var(--e2) var(--e3); align-items: center; flex-wrap: wrap; }
  .ordo-tete .lib { font-size: var(--t-xs); font-weight: 600; color: var(--encre-2); }
  .ordo input[type="file"]:focus-visible + label { outline: 2px solid var(--appl); outline-offset: 2px; }
  .ordo-vignette { width: 44px; height: 56px; object-fit: cover; border-radius: 4px; box-shadow: var(--ombre); }
  .ordo-fichier { font-size: var(--t-xs); color: var(--encre-2); min-width: 0; overflow-wrap: anywhere; }
  .ordo-ligne { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; }
  .ordo-ligne input { width: 100%; min-height: 32px; padding: 5px 8px; border-radius: var(--r-s); border: 1px dashed var(--vigil); background: var(--papier); font-size: var(--t-s); min-width: 0; }
  .ordo-ligne input:focus { outline: none; border-color: var(--appl); border-style: solid; }
  .ordo-ligne.fait { grid-template-columns: auto minmax(0, 1fr); font-size: var(--t-s); color: var(--ok); }
  .ordo-ligne.fait.ecarte { color: var(--encre-3); text-decoration: line-through; }
  .ordo-ligne.fait svg { width: 16px; height: 16px; }

  /* Pli central */
  .pli { align-content: start; }
  .pli .motif { width: 58px; height: 58px; }
  .pli .btn { min-height: 40px; padding: 4px 8px; text-align: center; line-height: 1.2; white-space: normal; }
  .pli .btn.plein { min-height: 46px; font-weight: 700; }
  .pli .note-pli { font-size: var(--t-xs); color: var(--encre-3); text-align: center; background: var(--coton); padding: 4px 0; }
  .avance { width: 100%; display: grid; gap: 5px; justify-items: center; text-align: center; font-size: var(--t-xs); color: var(--encre-2); background: var(--coton); padding: 6px 0; }
  .avance b { font-size: var(--t-xl); color: var(--encre); font-weight: 700; }
  .avance-trait { position: relative; width: 100%; height: 0; border-top: 2px dashed var(--appl-trace); }
  .avance-trait i { position: absolute; left: 0; top: -2px; height: 2px; background: var(--appl); transition: width 200ms ease-out; }
  .raccourcis { width: 100%; font-size: var(--t-xs); color: var(--encre-2); background: var(--coton); }
  .raccourcis summary { cursor: pointer; text-align: center; padding: 4px; color: var(--appl); font-weight: 600; }
  .raccourcis dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 6px; margin: 6px 0 0; align-items: baseline; }
  .raccourcis dd { margin: 0; }
  @media (max-width: 900px) {
    .pli { display: flex; flex-wrap: wrap; gap: var(--e2); align-items: center; overflow: visible; padding-inline: 0; }
    .pli .motif { display: none; }
    .pli .btn { width: auto; }
    .avance { width: 150px; }
    .raccourcis { width: 100%; }
  }

  /* Documents vivants */
  .docs { position: sticky; top: 64px; padding: var(--e4) var(--e4) var(--e4) 2px; display: grid; gap: var(--e2); align-content: start; }
  .docs-titre { font-size: var(--t-s); font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: var(--e2); }
  .docs-titre span { font-weight: 400; font-size: var(--t-xs); color: var(--encre-3); }
  .doc-carte { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px; border-radius: var(--r); }
  .doc-carte.actif { background: var(--appl-voile); }
  .mini { width: 84px; height: 119px; overflow: hidden; background: #ffffff; border-radius: 3px; box-shadow: var(--ombre); cursor: pointer; position: relative; transition: transform 150ms ease-out; }
  .mini:hover { transform: translateY(-2px); }
  .mini-page { width: 210mm; transform: scale(0.1058); transform-origin: 0 0; pointer-events: none; }
  .mini .a4 { box-shadow: none; max-width: none; width: 210mm; }
  .doc-texte { display: grid; gap: 5px; justify-items: start; font-size: var(--t-xs); color: var(--encre-2); min-width: 0; }
  .doc-nom { font-weight: 600; color: var(--encre); font-size: var(--t-s); line-height: 1.25; }
  .doc-note { line-height: 1.3; }
  .doc-note.manque { color: var(--encre-2); }
  @media (max-width: 1279px) {
    .cs-corps { grid-template-columns: minmax(0, 1fr); }
    .docs { order: -1; position: static; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); padding: var(--e3) var(--e4) 0; }
    .docs-titre { grid-column: 1 / -1; }
  }

  /* Aperçu */
  .apercu-barre { display: flex; flex-wrap: wrap; gap: var(--e2); align-items: center; padding: var(--e3) var(--e4); background: var(--papier); border-bottom: 1px solid var(--filet); }
  .onglets { display: flex; gap: 4px; flex-wrap: wrap; }
  .btn[aria-pressed="true"] { background: var(--appl); border-color: var(--appl); color: var(--sur-appl); }
  .note-modele { padding: 8px var(--e4); background: var(--vigil-voile); color: var(--vigil); font-size: var(--t-s); font-weight: 600; }
  .note-modele span { font-weight: 400; color: var(--encre-2); }
  .planche { min-width: 0; }

  /* A4 (reste blanc dans les deux thèmes) */
  .a4 p { margin: 3px 0; }
  .a4 ul { margin: 3px 0; padding-left: 18px; }
  .a4 .entete small { color: #555; }
  .a4 .vide-a4 { color: #9a9a9a; }
  .a4 .case { display: inline-block; width: 10px; height: 10px; border: 1px solid #333; margin-right: 6px; vertical-align: -1px; }
  .a4 .encadre { border: 1px solid #13457b; padding: 6px 9px; margin-top: 6px; }
  .a4 .encadre b { color: #13457b; }
  .a4 .a-reprendre { border: 1px dashed #999; color: #666; padding: 8px; margin-top: 8px; font-size: 9.5pt; }
  .a4 .titre-doc { text-align: right; }
  .a4 .pied-a4 { position: absolute; bottom: 8mm; left: 14mm; right: 14mm; font-size: 7.5pt; color: #888; display: flex; justify-content: space-between; gap: 8px; }
  .a4 [contenteditable="true"] { outline: 1px dashed #13457b; outline-offset: 2px; background: #f2f6fb; border-radius: 2px; }
  .a4 [contenteditable="true"]:focus { outline-style: solid; }
  .a4 .mention { font-size: 9pt; color: #444; }

  /* Formulaires de page */
  .actions { display: flex; gap: var(--e2); flex-wrap: wrap; align-items: center; }
  .erreur { color: var(--rappel); font-size: var(--t-xs); font-weight: 600; }
  .form-nv { max-width: 900px; }
  .case-sans { display: flex; gap: 6px; align-items: center; font-size: var(--t-s); margin-top: 4px; }
  .case-sans input { width: 16px; height: 16px; accent-color: var(--appl); }
  .choix { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--e3); }
  .choix > div { display: grid; gap: 6px; justify-items: start; align-content: start; }
  .choix p { margin: 0; font-size: var(--t-s); color: var(--encre-2); }
  .lecture { display: grid; grid-template-columns: minmax(110px, 40%) minmax(0, 1fr); gap: 6px var(--e3); margin: 0; font-size: var(--t-s); }
  .lecture dt { color: var(--encre-3); }
  .lecture dd { margin: 0; font-weight: 600; }
  .grille-lecture { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--e4); align-items: start; }

  /* Chronomètre */
  .chrono { flex-wrap: wrap; max-width: min(640px, calc(100vw - 32px)); }
  .chrono svg { width: 16px; height: 16px; }
  .chrono select { background: var(--encre); color: var(--coton); border: 1px solid color-mix(in srgb, var(--coton) 30%, transparent); border-radius: var(--r-s); padding: 3px 6px; max-width: 260px; }
  .chrono-temps { font-size: var(--t-l); min-width: 6ch; }
  .chrono-res { flex-basis: 100%; font-size: var(--t-xs); opacity: 0.85; display: grid; gap: 2px; }
  .chrono-res:empty { display: none; }

  /* ===================== V1 ===================== */
  :root { --barre-h: 56px; --tete-h: 0px; }
  /* Le socle donne height: 100% au body, ce qui borne le collant de la barre au premier écran. */
  html, body { height: auto; min-height: 100%; }

  /* Sélecteur de version, enregistrement */
  .versions { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .v-choix { display: inline-flex; align-items: center; gap: 4px; }
  .v-choix a { color: var(--encre-2); text-decoration: underline; text-underline-offset: 3px; padding: 1px 4px; border-radius: var(--r-s); }
  .v-choix a:hover { color: var(--appl); }
  .v-choix a[aria-current="page"] { color: var(--sur-appl); background: var(--appl); text-decoration: none; font-weight: 700; }
  .sauve { margin: 0; display: inline-flex; align-items: center; gap: 7px; font-size: var(--t-xs); color: var(--encre-2); white-space: nowrap; min-width: 0; }
  .sauve-point { width: 9px; height: 9px; border-radius: 50%; background: var(--appl); flex: none; transition: background 150ms ease-out; }
  .sauve[data-etat="encours"] .sauve-point { background: transparent; box-shadow: inset 0 0 0 1.5px var(--appl); }
  .sauve[data-etat="horsligne"] { color: var(--encre); font-weight: 600; }
  .sauve[data-etat="horsligne"] .sauve-point { background: transparent; border: 1.5px dashed var(--encre-2); }
  @media (max-width: 1100px) { .sauve { white-space: normal; } }

  /* Tête de fiche collante : bandeau, bande d'intubation, patient connu */
  /* Le bandeau complet reste dans le flux ; quand il passe sous la barre, le bandeau compact,
     fixé exactement sous ce qui reste visible en haut (barre collante, ou rien sous 700 px), prend le relais.
     Les hauteurs viennent d'un ResizeObserver, au pixel près ; le compact glisse 1 px sous la barre pour qu'aucun interstice n'apparaisse. */
  .tete-fiche { position: relative; z-index: 15; }
  .tete-compacte {
    position: fixed; left: 0; right: 0; top: max(0px, calc(var(--barre-h) - 1px)); z-index: 18;
    background: var(--appl-plein); color: var(--sur-plein); box-shadow: 0 1px 0 var(--filet), 0 6px 14px #0d1b2a1f;
    visibility: hidden; opacity: 0; transform: translateY(-6px); pointer-events: none;
    transition: opacity 160ms cubic-bezier(.16,1,.3,1), transform 160ms cubic-bezier(.16,1,.3,1), visibility 0s linear 160ms;
  }
  .tete-compacte.visible { visibility: visible; opacity: 1; transform: none; pointer-events: auto; transition-delay: 0s; }
  .compacte-ligne { display: flex; align-items: center; flex-wrap: wrap; gap: 4px var(--e3); padding: 6px var(--e4); min-width: 0; }
  .c-nom { font-size: var(--t-l); font-weight: 700; letter-spacing: -0.005em; white-space: nowrap; }
  .c-info { font-size: var(--t-s); white-space: nowrap; opacity: 0.92; }
  .c-info b { font-weight: 700; }
  .c-info.nr { opacity: 0.75; font-style: normal; }
  .c-info + .c-info::before { content: "·"; margin-right: var(--e3); opacity: 0.6; }
  .compacte-ligne .badge { font-size: var(--t-xs); padding: 1px 9px; }
  .tete-compacte .bande-intub { padding-block: 4px; font-size: var(--t-xs); flex-wrap: nowrap; white-space: nowrap; overflow: hidden; }
  .tete-compacte .bande-intub span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  @media (max-width: 700px) {
    .compacte-ligne { gap: 2px var(--e2); padding: 5px var(--e3); }
    .c-nom { font-size: var(--t-m); flex-basis: 100%; }
    .c-info + .c-info::before { margin-right: var(--e2); }
    .compacte-ligne .badge { max-width: calc(50vw - 20px); }
  }
  @media (max-width: 700px) {
    .bandeau.v1 .info { display: none; }
    .bandeau.v1 .nom { font-size: var(--t-xl); }
    .bandeau.v1 .nom small, .bandeau.v1 .lien-bandeau { font-size: var(--t-xs); }
    .bandeau.v1 { padding-block: 8px; }
    .bandeau-bas { padding-top: 4px; }
    .synthese { font-size: var(--t-xs); }
    .bande-intub { padding-block: 5px; font-size: var(--t-xs); }
  }
  .bandeau.v1 { grid-template-columns: minmax(200px, 1.5fr) repeat(auto-fit, minmax(84px, 1fr)); row-gap: 6px; padding-block: 10px; }
  .bandeau.v1 .info b { white-space: nowrap; }
  .bandeau.v1 .info b.nr { font-weight: 400; opacity: 0.8; font-size: var(--t-s); }
  .bandeau-bas { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px var(--e3); align-items: center; padding-top: 6px; border-top: 1px dashed color-mix(in srgb, var(--sur-plein) 35%, transparent); }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: var(--t-s); font-weight: 600; line-height: 1.35; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .badge svg { width: 14px; height: 14px; flex: none; }
  .badge.acte { background: #ffffff; color: var(--appl-plein); }
  .badge.allergie { background: var(--rappel-voile); color: var(--rappel); }
  .badge.sans { border: 1px solid color-mix(in srgb, var(--sur-plein) 60%, transparent); color: var(--sur-plein); }
  .badge.nr { border: 1px dashed color-mix(in srgb, var(--sur-plein) 70%, transparent); color: var(--sur-plein); font-weight: 400; }
  .badge.profil { color: var(--sur-plein); opacity: 0.9; font-weight: 400; padding-inline: 2px; }
  .synthese { margin: 0; flex: 1 1 360px; min-width: 0; font-size: var(--t-s); color: var(--sur-plein); }
  .synthese b { font-weight: 700; }
  .synthese .lib-s { text-transform: uppercase; letter-spacing: 0.06em; font-size: var(--t-xs); opacity: 0.75; margin-right: 6px; }
  .bande-intub {
    display: flex; gap: var(--e2) var(--e3); align-items: center; flex-wrap: wrap; padding: 7px var(--e4);
    background: var(--rappel); color: #ffffff; font-weight: 700; font-size: var(--t-s); letter-spacing: 0.02em;
  }
  :root[data-theme="dark"] .bande-intub { color: #1a0605; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bande-intub { color: #1a0605; } }
  .bande-intub svg { width: 16px; height: 16px; flex: none; }
  .bande-intub span { font-weight: 400; }
  .connu {
    display: flex; gap: var(--e2) var(--e3); align-items: flex-start; flex-wrap: wrap; padding: 8px var(--e4);
    background: var(--rappel-voile); color: var(--rappel); font-size: var(--t-s);
  }
  .connu > svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
  .connu-corps { flex: 1 1 400px; min-width: 0; display: grid; gap: 2px; }
  .connu b { font-weight: 700; }
  .connu ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; color: var(--encre); }
  .connu li small { color: var(--encre-2); font-size: var(--t-xs); }
  .connu .lien { color: var(--rappel); font-size: var(--t-xs); text-decoration-color: currentColor; }
  .pli { top: calc(var(--barre-h) + var(--tete-h) + 12px); max-height: calc(100vh - var(--barre-h) - var(--tete-h) - 24px); overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
  .docs { top: calc(var(--barre-h) + var(--tete-h) + 4px); max-height: calc(100vh - var(--barre-h) - var(--tete-h) - 8px); overflow-y: auto; }
  @media (max-width: 1279px) { .docs { max-height: none; overflow: visible; } }
  @media (max-width: 900px) { .pli { max-height: none; overflow: visible; } }
  .piece { scroll-margin-top: calc(var(--barre-h) + var(--tete-h) + 16px); }
  .saisie-bloc, .champ, .vignette, .plan-ligne { scroll-margin-top: calc(var(--barre-h) + var(--tete-h) + 24px); }

  /* Marques P1 : RAS ou défaut, à confirmer */
  .marque-ras, .marque-repris { border: 0; background: none; cursor: pointer; padding: 0 2px; border-radius: 3px; }
  .marque-ras:hover, .marque-repris:hover { text-decoration: underline; text-underline-offset: 2px; }
  .marque-repris { color: var(--appl); }
  .repris-champ { position: relative; }
  .repris-champ input, .repris-champ textarea { border-style: dashed; border-color: var(--appl-trace); }
  .confirmer-piece { border: 1px dashed color-mix(in srgb, var(--sur-plein) 70%, transparent); background: transparent; color: var(--sur-plein); border-radius: var(--r-s); padding: 1px 8px; font-size: var(--t-xs); cursor: pointer; text-transform: none; letter-spacing: 0; font-weight: 600; white-space: nowrap; }
  .confirmer-piece:hover { background: color-mix(in srgb, var(--sur-plein) 16%, transparent); }
  .piece > header .tete-droite { display: inline-flex; gap: var(--e2); align-items: center; flex-wrap: wrap; justify-content: flex-end; }

  /* Rappels : règle fixe et donnée déclenchante (P2, P3) */
  .rappel .r-tete { display: flex; gap: 6px var(--e2); align-items: baseline; flex-wrap: wrap; }
  .regle {
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 0 6px; border-radius: 999px;
    border: 1px solid currentColor; opacity: 0.85; cursor: help; line-height: 1.5;
  }
  .rappel .decl { margin: 2px 0 0; font-weight: 400; color: var(--encre-2); display: grid; gap: 1px; }
  .rappel .decl b { color: var(--encre); font-weight: 600; }
  .rappel .decl small { color: var(--encre-3); font-size: var(--t-xs); }

  /* Règle d'affichage visible au survol (P7) */
  .regle-aff { position: relative; display: inline-flex; align-items: center; gap: 4px; cursor: help; text-decoration: underline dotted; text-underline-offset: 3px; }
  .regle-aff::after {
    content: attr(data-texte); position: absolute; right: 0; top: calc(100% + 6px); z-index: 25; white-space: nowrap;
    background: var(--encre); color: var(--coton); padding: 4px 8px; border-radius: var(--r-s); font-size: var(--t-xs); font-weight: 400;
    letter-spacing: 0; text-transform: none; box-shadow: var(--ombre); pointer-events: none; display: none;
  }
  .regle-aff:hover::after, .regle-aff:focus-visible::after { display: block; animation: bulle 150ms cubic-bezier(.16,1,.3,1) both; }
  @keyframes bulle { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }
  .regle-aff:focus-visible { outline-color: var(--sur-plein); }

  /* Segments (profil, site, continuer / arrêter, seuils) */
  .segment { display: inline-flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--filet); border-radius: var(--r-s); overflow: hidden; background: var(--papier); }
  .segment button { border: 0; border-right: 1px solid var(--filet); background: transparent; padding: 6px 12px; min-height: 34px; cursor: pointer; color: var(--encre-2); font-size: var(--t-s); }
  .segment button:last-child { border-right: 0; }
  .segment button:hover { color: var(--appl); background: var(--appl-voile); }
  .segment button[aria-pressed="true"] { background: var(--appl); color: var(--sur-appl); font-weight: 600; }
  .segment button:disabled { cursor: default; }
  .segment button:disabled:not([aria-pressed="true"]) { color: var(--encre-3); background: transparent; }
  .segment.petit button { min-height: 28px; padding: 3px 10px; }
  .note-regle { font-size: var(--t-xs); color: var(--encre-3); }

  /* Création de consultation : l'acte d'abord */
  .creation .corps { gap: var(--e4); }
  .etape { display: grid; gap: var(--e2); min-width: 0; }
  .etape-tete { display: flex; align-items: baseline; gap: var(--e2) var(--e3); flex-wrap: wrap; }
  .etape-tete h3 { font-size: var(--t-m); }
  .etape-tete .sous { font-size: var(--t-xs); }
  .puces { display: flex; flex-wrap: wrap; gap: 8px; }
  .puce-acte {
    border: 1px solid var(--filet); background: var(--papier); color: var(--encre); border-radius: var(--r-s);
    padding: 7px 12px; min-height: 38px; cursor: pointer; font-weight: 600; font-size: var(--t-s); letter-spacing: 0.01em;
    transition: border-color 150ms ease-out, background 150ms ease-out;
  }
  .puce-acte small { display: block; font-weight: 400; color: var(--encre-3); font-size: 11px; letter-spacing: 0; }
  .puce-acte:hover { border-color: var(--appl); color: var(--appl); }
  .puce-acte[aria-pressed="true"] { background: var(--appl); border-color: var(--appl); color: var(--sur-appl); }
  .puce-acte[aria-pressed="true"] small { color: var(--sur-appl); opacity: 0.8; }
  .acte-recherche { display: flex; gap: var(--e2); align-items: center; flex-wrap: wrap; }
  .acte-recherche .champ-r { flex: 1 1 260px; max-width: 420px; background: var(--papier); }
  .acte-resultats { display: flex; flex-wrap: wrap; gap: 6px; }
  .consignes-acte { display: grid; gap: 6px; }
  .creation-actions { display: flex; gap: var(--e2); flex-wrap: wrap; align-items: center; padding-top: var(--e3); border-top: 1px dashed var(--appl-trace); }
  .creation-actions p { margin: 0; font-size: var(--t-xs); color: var(--encre-2); flex: 1 1 220px; }

  /* Comorbidités par appareil (V1-02) */
  .como { display: grid; gap: var(--e2); }
  .como-groupe { position: relative; display: grid; gap: 6px; padding: 8px 10px; border-radius: var(--r-s); background: var(--coton); }
  .como-groupe.ras-pose { background: var(--appl-voile); }
  .como-groupe.ras-pose::after { content: ""; position: absolute; inset: -4px; border: 1.5px dashed var(--appl); border-radius: 9px; pointer-events: none; animation: piqure 520ms cubic-bezier(.16,1,.3,1) both; }
  .como-groupe.ras-pose.fixe::after { animation: none; }
  .como-tete { display: flex; align-items: center; gap: var(--e2); flex-wrap: wrap; }
  .como-tete h4 { margin: 0; font-size: var(--t-s); font-weight: 700; }
  .compteur { font-family: var(--chiffres); font-size: var(--t-xs); padding: 0 7px; border-radius: 999px; background: var(--papier); color: var(--encre-2); border: 1px solid var(--filet); }
  .compteur.plein { background: var(--appl); color: var(--sur-appl); border-color: var(--appl); }
  .compteur.ras { background: var(--appl-voile); color: var(--appl); border: 1px dashed var(--appl); font-family: var(--texte); font-weight: 700; }
  .compteur.nr { border-style: dashed; color: var(--encre-3); font-family: var(--texte); }
  .como-tete .espace { flex: 1; }
  .como-tete .marque-ras { position: static; }
  .cases { display: flex; flex-wrap: wrap; gap: 6px; }
  .case {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 7px; border: 1px solid var(--filet); border-radius: var(--r-s);
    background: var(--papier); font-size: var(--t-s); cursor: pointer; color: var(--encre-2); line-height: 1.3; min-height: 30px;
  }
  .case:hover { border-color: var(--appl); color: var(--appl); }
  .case input { width: 16px; height: 16px; margin: 0; accent-color: var(--appl); }
  .case:has(input:checked) { border-color: var(--appl); color: var(--encre); font-weight: 600; background: var(--appl-voile); }
  .case:has(input:disabled) { cursor: default; }
  .case.ajout { border-style: dashed; }
  .como-libre { width: 100%; min-height: 32px; padding: 5px 9px; border-radius: var(--r-s); border: 1px solid var(--filet); background: var(--papier); font-size: var(--t-s); }
  .como-libre:focus { border-color: var(--appl); outline: 1.5px dashed var(--appl); outline-offset: 3px; }

  /* Voies aériennes (V1-05) */
  .mallampati { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .vignette {
    display: grid; justify-items: center; gap: 2px; padding: 6px 4px 4px; border: 1px solid var(--filet); border-radius: var(--r-s);
    background: var(--papier); color: var(--encre-2); cursor: pointer; min-width: 0; position: relative;
    transition: border-color 150ms ease-out, background 150ms ease-out;
  }
  .vignette svg { width: 100%; max-width: 92px; height: auto; aspect-ratio: 64 / 56; }
  .vignette b { font-family: var(--chiffres); font-size: var(--t-s); font-weight: 600; color: var(--encre); }
  .vignette:hover { border-color: var(--appl); color: var(--appl); }
  .vignette[aria-pressed="true"] { border-color: var(--appl); background: var(--appl-voile); color: var(--appl); }
  .vignette[aria-pressed="true"]::after { content: ""; position: absolute; inset: -4px; border: 1.5px dashed var(--appl); border-radius: 9px; pointer-events: none; }
  .vignette:disabled { cursor: default; }
  .mv-trait { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .mv-fond { fill: var(--coton); }
  .vignette[aria-pressed="true"] .mv-fond { fill: var(--papier); }
  .mv-langue { fill: var(--papier); stroke: currentColor; stroke-width: 1.6; }
  .mv-langue-t { fill: currentColor; opacity: 0.16; }
  .mv-dur { fill: currentColor; opacity: 0.22; }
  .mv-gorge { fill: currentColor; opacity: 0.2; }
  .seuils { display: flex; flex-wrap: wrap; gap: var(--e3); }
  .seuils .champ { gap: 4px; }
  .dents { display: grid; grid-template-columns: minmax(110px, max-content) repeat(2, 64px); justify-content: start; gap: 4px 10px; align-items: center; font-size: var(--t-s); }
  .dents .d-tete { font-size: var(--t-xs); color: var(--encre-3); font-weight: 600; text-align: center; text-transform: uppercase; letter-spacing: 0.06em; }
  .dents .d-lib { color: var(--encre-2); }
  .d-case { display: grid; place-items: center; min-height: 32px; border: 1px solid var(--filet); border-radius: var(--r-s); background: var(--papier); cursor: pointer; }
  .d-case:hover { border-color: var(--appl); }
  .d-case:has(input:checked) { background: var(--appl-voile); border-color: var(--appl); }
  .d-case input { width: 16px; height: 16px; margin: 0; accent-color: var(--appl); }
  .sous-titre { font-size: var(--t-xs); color: var(--encre-2); font-weight: 600; letter-spacing: 0.02em; display: flex; justify-content: space-between; gap: var(--e2); }

  /* Bornes de plausibilité (V1-12) */
  .bornes { display: grid; gap: 4px; }
  .borne { display: flex; gap: 6px; align-items: flex-start; font-size: var(--t-xs); font-weight: 600; color: var(--vigil); }
  .borne svg { width: 14px; height: 14px; flex: none; margin-top: 1px; }
  .borne span { font-weight: 400; color: var(--encre-2); }
  .hors-borne input { border-style: dashed; border-color: var(--vigil); }

  /* Plan « continuer sauf » (V1-08) */
  .plan { display: grid; gap: 6px; }
  .plan-ligne { display: grid; grid-template-columns: minmax(110px, 1fr) auto; gap: 6px var(--e3); align-items: center; padding: 8px 10px; border-radius: var(--r-s); background: var(--coton); position: relative; }
  .plan-ligne.defaut { background: var(--appl-voile); }
  .plan-ligne.defaut::after { content: ""; position: absolute; inset: -3px; border: 1.5px dashed var(--appl-trace); border-radius: 8px; pointer-events: none; }
  .plan-nom { font-weight: 600; font-size: var(--t-s); overflow-wrap: anywhere; }
  .plan-nom small { display: block; font-weight: 600; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--appl); }
  .plan-arret { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px var(--e3); align-items: center; font-size: var(--t-s); }
  .plan-arret input { width: 64px; min-height: 32px; padding: 4px 8px; border: 1px solid var(--filet); border-radius: var(--r-s); background: var(--papier); font-family: var(--chiffres); }
  .plan-arret input:focus { border-color: var(--appl); outline: 1.5px dashed var(--appl); outline-offset: 3px; }
  .plan-arret label { font-size: var(--t-xs); color: var(--encre-2); font-weight: 600; }
  .derniere-prise { font-weight: 600; }
  .derniere-prise.nr { font-weight: 400; color: var(--encre-3); }
  .plan-pied { display: flex; gap: var(--e2); align-items: center; flex-wrap: wrap; font-size: var(--t-xs); color: var(--encre-2); }

  /* Jeûne en heures (V1-09) */
  .jeune { display: grid; gap: 6px; padding: 10px; border-radius: var(--r-s); background: var(--coton); }
  .jeune-lignes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 6px var(--e3); }
  .jeune-ligne { display: grid; gap: 1px; }
  .jeune-ligne span { font-size: var(--t-xs); color: var(--encre-2); font-weight: 600; }
  .jeune-ligne b { font-family: var(--chiffres); font-size: var(--t-xl); font-weight: 600; line-height: 1.15; }
  .jeune-ligne b.nr { font-family: var(--texte); font-size: var(--t-s); font-weight: 400; color: var(--encre-3); }
  .jeune-ligne small { font-size: var(--t-xs); color: var(--encre-3); }
  .jeune-source { font-size: var(--t-xs); color: var(--encre-3); margin: 0; }

  /* Ordonnance jointe (V1-07) */
  .ordo-jointe { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--e3); align-items: center; }
  .ordo-vignette { width: 52px; height: 66px; }
  .ordo-sans { width: 52px; height: 66px; border-radius: 4px; display: grid; place-items: center; background: var(--papier); color: var(--encre-3); box-shadow: var(--ombre); }
  .ordo-sans svg { width: 20px; height: 20px; }
  .ordo-meta { display: grid; gap: 2px; font-size: var(--t-xs); color: var(--encre-2); min-width: 0; }
  .ordo-meta b { color: var(--encre); font-size: var(--t-s); overflow-wrap: anywhere; }
  .ordo-meta .actions { margin-top: 4px; }

  /* Manques avant impression (V1-10) */
  .lien-manque {
    display: inline; text-align: left; border: 0; background: none; padding: 0; cursor: pointer; color: var(--appl); font-weight: 600; font-size: inherit;
    text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px;
  }
  .lien-manque:hover { text-decoration-style: solid; }
  .manques-lot { grid-column: 1 / -1; display: grid; gap: 6px; padding-top: var(--e3); border-top: 1px dashed var(--appl-trace); }
  .manques-lot h3 { font-size: var(--t-s); display: flex; gap: var(--e2); align-items: baseline; flex-wrap: wrap; }
  .manques-lot h3 span { font-weight: 400; color: var(--encre-2); font-size: var(--t-xs); }
  .manques-lot ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }

    if (afaire.length) return { txt: "complet, à valider par le médecin", pret: false };
    return { txt: etatDossier(c) === "imprime" ? "imprimé" : "prêt", pret: true };
  }

  function touche(c, champs) {
    DOCS.forEach(function (d) {
      var concerne = d.k === "consultation" || champs.some(function (k) { return DOC_CHAMPS[d.k].indexOf(k) >= 0; });
      if (concerne && c.docs[d.k] === "imprime") { c.docs[d.k] = "pret"; S.modif[c.id + d.k] = true; }
    });
  }
  function presse(val, v, multi) {
    val = String(val || "");
    if (!multi) return val === v;
    return val.split(/\s*,\s*/).some(function (x) { return x === v || x.indexOf(v + " ") === 0; });
  }
  function basculer(val, v, multi) {
    val = String(val || "").trim();
    if (!multi) return val === v ? "" : v;
    var parts = val ? val.split(/\s*,\s*/).filter(Boolean) : [];
    var i = -1;
    parts.forEach(function (x, j) { if (x === v || x.indexOf(v + " ") === 0) i = j; });
    if (i >= 0) parts.splice(i, 1);
    else if (EXCLUSIFS.indexOf(v) >= 0) parts = [v];
    else { parts = parts.filter(function (x) { return EXCLUSIFS.indexOf(x) < 0; }); parts.push(v); }
    return parts.join(", ");
  }
  function inserer(val, v) {
    val = String(val || "");
    if (v.indexOf("- ") === 0) return (val.trim() ? val.replace(/\s+$/, "") + "\n" : "") + v + " ";
    return val + (val && !/\s$/.test(val) ? " " : "") + v + " ";
  }
  function rangeTri(a, b) {
    var sa = a.site === "Cardella" ? 0 : 1, sb = b.site === "Cardella" ? 0 : 1;
    return sa - sb || (a.heure || "99").localeCompare(b.heure || "99");
  }
  function typeQ(q) {
    if (/^\d{1,2}[\/.-]/.test(q)) return "date de naissance";
    if (/^\d[\d\s]*$/.test(q)) return "DN";
    return "nom";
  }
  var COURT_RAPPEL = {
    "Attention intubation": ["Intubation", ""], "Attention allergie": ["Allergie", ""],
    "Autorisation d'opérer": ["Autorisation", "vigil"], "Consigne éphédrine ajoutée": ["Éphédrine", "info"],
    "Consignes ophtalmologie": ["Ophtalmo", "info"], "Patient sans DN": ["Sans DN", "neutre"]
  };
  function pastilles(c) {
    var r = P.rappels(c);
    if (!r.length) return '<span class="aucun">aucun</span>';
    return '<span class="pastilles">' + r.map(function (x) {
      var m = COURT_RAPPEL[x.titre] || [x.titre, x.niveau === "info" ? "info" : ""];
      return '<span class="pastille ' + m[1] + '" title="' + e(x.titre + " : " + x.detail) + '">' + e(m[0]) + "</span>";
    }).join("") + "</span>";
  }
  function etatPill(c, doc) {
    var s = c.docs[doc];
    if (s === "a-faire" && !manques(c, doc).length) s = "a-valider";
    return '<span class="etat ' + s + '"' + (s === "imprime" && c.imprimeManque[doc] ? ' title="imprimé malgré un manque"' : "") + ">" + ETAT_TXT[s] + (s === "imprime" && c.imprimeManque[doc] ? ", avec manque" : "") + "</span>";
  }

  /* Toast ------------------------------------------------------------------ */
  var toastT = null;
  function toast(msg, action, fn) {
    var el = $("#toast");
    el.innerHTML = "<span>" + e(msg) + "</span>" + (action ? '<button type="button" id="toast-action">' + e(action) + "</button>" : "");
    el.hidden = false; S.toastFn = fn || null;
    clearTimeout(toastT);
    toastT = setTimeout(function () { el.hidden = true; S.toastFn = null; }, action ? 8000 : 4500);
  }

  /* Vue : Demain (V1-10, V1-11) ---------------------------------------------- */
  function demainListe() { return P.consultations.filter(function (c) { return c.dateInt === P.DEMAIN; }).map(prep).sort(rangeTri); }
  function nPrets(l) { return l.filter(function (c) { return etatDossier(c) !== "incomplet"; }).length; }
  function vueDemain() {
    var liste = demainListe();
    var prets = liste.filter(function (c) { return etatDossier(c) === "pret"; });
    var incomplets = liste.filter(function (c) { return etatDossier(c) === "incomplet"; });
    var imprimes = liste.filter(function (c) { return etatDossier(c) === "imprime"; });
    var nDocs = 0;
    prets.forEach(function (c) { DOCS.forEach(function (d) { if (c.docs[d.k] === "pret") nDocs++; }); });
    var nDocsInc = 0;
    incomplets.forEach(function (c) { DOCS.forEach(function (d) { if (c.docs[d.k] !== "imprime") nDocsInc++; }); });

    var lecture = S.role === "facturation";
    var h = '<div class="page">';
    h += '<div class="titre-page"><h1>Demain</h1><p class="sous">' + e(P.dateFr(P.DEMAIN, true)) + " · " + pluriel(liste.length, "intervention") + ", Cardella et Mamao</p>" +
      '<span class="compteur-tete" id="compteur-demain"><b>' + nPrets(liste) + "</b> " + (nPrets(liste) > 1 ? "prêts" : "prêt") + " sur " + liste.length + (imprimes.length ? ", dont " + imprimes.length + (imprimes.length > 1 ? " imprimés" : " imprimé") : "") + "</span>";
    if (!lecture) h += '<span class="espace"></span><button type="button" class="btn" id="demain-nouveau" data-act="nouveau-patient">' + ic("plus") + "Nouveau patient</button>";
    h += "</div>";
    h += '<div class="demain"><div class="programme">';
    if (!lecture) {
      h += '<section class="lot" aria-labelledby="t-lot">' + P.motif(46) + '<div><h2 id="t-lot">Impression de la veille</h2><p>' +
        (prets.length ? pluriel(prets.length, "dossier prêt", "dossiers prêts") + ", " + pluriel(nDocs, "document") + ". " : "Aucun dossier prêt pour l'instant. ") +
        (incomplets.length ? pluriel(incomplets.length, "dossier incomplet", "dossiers incomplets") + ", détail ci-dessous. " : "") +
        (imprimes.length ? pluriel(imprimes.length, "dossier déjà imprimé", "dossiers déjà imprimés") + "." : "") + "</p></div>";
      h += '<div class="lot-actions"><button type="button" class="btn plein" id="lot-imprimer" data-act="lot-preparer"' + (prets.length ? "" : " disabled") + ">" + ic("imprimante") +
        (prets.length ? "Imprimer les " + pluriel(prets.length, "dossier prêt", "dossiers prêts") : "Rien de prêt à imprimer") + "</button>" +
        '<button type="button" class="btn" id="lot-apercu" data-act="lot-apercu"' + (prets.length || S.lotImprime.length ? "" : " disabled") + ">" + ic("document") + "Voir les feuilles</button></div>";
      if (S.lot === "prets" && prets.length) {
        h += '<div class="lot-confirm" id="lot-confirm"><p>' + pluriel(nDocs, "document") + " dans l'ordre du programme, Cardella puis Mamao, par heure : " +
          e(prets.map(function (c) { var p = P.patient(c.patient); return nomP(p) + " (" + DOCS.filter(function (d) { return c.docs[d.k] === "pret"; }).length + ")"; }).join(", ")) +
          '.</p><button type="button" class="btn plein" id="lot-confirmer" data-act="lot-confirmer">' + ic("coche") + "Confirmer l'impression</button>" +
          '<button type="button" class="btn" id="lot-annuler" data-act="lot-annuler">Annuler</button></div>';
      }
      if (incomplets.length) {
        h += '<div class="manques-lot" id="manques-lot"><h3>Manques avant impression <span>' + pluriel(incomplets.length, "dossier incomplet", "dossiers incomplets") + " · un manque ouvre la fiche sur le champ</span></h3><ul>";
        incomplets.forEach(function (c) {
          var p = P.patient(c.patient);
          h += "<li><b>" + e(nomP(p)) + "</b>" + DOCS.filter(function (d) { return c.docs[d.k] === "a-faire"; }).map(function (d) {
            var m = manques(c, d.k);
            return '<span><span class="m-doc">' + d.court + " : </span>" + (m.length ? liensManques(c, m) : '<button type="button" class="lien-manque" data-act="ouvrir-cs" data-id="' + c.id + '">à valider</button>') + "</span>";
          }).join("") + "</li>";
        });
        h += "</ul>";
        if (S.lot === "tous") {
          h += '<div class="confirme-manque" id="lot-confirme-tous"><p><b>Imprimer malgré les manques ?</b> ' + pluriel(incomplets.length, "dossier incomplet part", "dossiers incomplets partent") + " avec les prêts (" + pluriel(nDocs + nDocsInc, "document") + "). Les champs manquants s'imprimeront « non renseigné ».</p>" +
            '<button type="button" class="btn plein" id="lot-confirmer-tous" data-act="lot-confirmer-tous">' + ic("imprimante") + "Imprimer malgré les manques</button>" +
            '<button type="button" class="btn" id="lot-annuler-tous" data-act="lot-annuler">Annuler</button></div>';
        } else h += '<div><button type="button" class="btn petit pique" id="lot-tous" data-act="lot-tous">' + ic("imprimante") + "Imprimer aussi les dossiers incomplets</button></div>";
        h += "</div>";
      }
      h += "</section>";
    }
    sites.forEach(function (site) {
      var l = liste.filter(function (c) { return c.site === site; });
      if (!l.length) return;
      h += '<section aria-labelledby="t-site-' + site + '"><h2 class="section" id="t-site-' + site + '">' + site + ' <span class="compte"><b class="num">' + nPrets(l) + "</b> " + (nPrets(l) > 1 ? "prêts" : "prêt") + " sur " + l.length + "</span></h2>";
      h += '<div class="table-zone"><table class="liste programme-jour"><thead><tr><th scope="col">Heure</th><th scope="col">Patient</th><th scope="col">Intervention</th><th scope="col">Anesthésiste</th><th scope="col">Rappels</th>' +
        DOCS.map(function (d) { return '<th scope="col">' + d.court + "</th>"; }).join("") + '<th scope="col">En attente</th></tr></thead><tbody>';
      l.forEach(function (c) {
        var p = P.patient(c.patient), mo = motifAttente(c);
        h += '<tr data-act="ouvrir-cs" data-id="' + c.id + '"' + (etatDossier(c) === "imprime" ? ' class="tout-imprime"' : "") + ">" +
          '<td class="num" data-label="Heure">' + e(c.heure || "") + "</td>" +
          '<td><button type="button" class="lien" id="ouvrir-' + c.id + '" data-act="ouvrir-cs" data-id="' + c.id + '">' + e(nomP(p)) + "</button><small>" + e(P.ageTexte(p.ddn, P.AUJOURDHUI)) + " · " + e(dnTxt(p)) + "</small></td>" +
          '<td data-label="Intervention">' + e(c.intervention) + (c.precision ? " · " + e(c.precision) : "") + "<small>" + e(c.chirurgien) + "</small></td>" +
          '<td data-label="Anesthésiste">' + e(c.anesthesiste) + '</td><td data-label="Rappels">' + pastilles(c) + "</td>" +
          DOCS.map(function (d) { return '<td data-label="' + d.court + '">' + etatPill(c, d.k) + "</td>"; }).join("") +
          '<td data-label="En attente"><span class="motif-attente' + (mo.pret ? " pret" : "") + '">' + e(mo.txt) + "</span></td></tr>";
      });
      h += "</tbody></table></div></section>";
    });
    h += "</div>";
    var jour = P.consultations.filter(function (c) { return c.dateCs === P.AUJOURDHUI && c.dateInt !== P.DEMAIN && etatDossier(c) === "incomplet"; }).map(prep);
    h += '<section class="jour" aria-labelledby="t-jour"><h2 id="t-jour">Consultations du jour à compléter</h2><p class="sous">' + e(P.dateFr(P.AUJOURDHUI, true)) + "</p>";
    h += '<ul class="jour-liste">';
    if (!jour.length) h += '<li><div class="vide">' + P.motif(72) + "<p>Toutes les consultations du jour sont complètes.</p></div></li>";
    jour.forEach(function (c) {
      var p = P.patient(c.patient), a = avance(c), mo = motifAttente(c);
      h += '<li><button type="button" class="lien" id="jour-' + c.id + '" data-act="ouvrir-cs" data-id="' + c.id + '">' + e(nomP(p)) + "</button>" +
        (lecture ? "" : '<button type="button" class="btn petit" id="completer-' + c.id + '" data-act="ouvrir-cs" data-id="' + c.id + '">Compléter</button>') +
        '<span class="detail"><span>' + e(c.intervention || "intervention à préciser") + (c.dateInt ? " · le " + df(c.dateInt) : "") + "</span>" +
        '<span class="num">' + a.n + " / " + a.t + " rubriques</span>" + pastilles(c) + '<span class="motif-attente">' + e(mo.txt) + "</span></span></li>";
    });
    h += "</ul></section></div></div>";
    return h;
  }

  /* Vue : impression du lot -------------------------------------------------- */
  function vueLot() {
    var liste = demainListe();
    var prets = liste.filter(function (c) { return etatDossier(c) === "pret"; });
    var feuilles = [];
    if (prets.length) prets.forEach(function (c) { DOCS.forEach(function (d) { if (c.docs[d.k] === "pret") feuilles.push([c, d.k]); }); });
    else S.lotImprime.forEach(function (x) { feuilles.push([cs(x[0]), x[1]]); });
    var h = '<div class="apercu-barre"><button type="button" class="btn petit" id="lot-retour" data-act="aller" data-vue="demain">' + ic("retour") + "Retour à demain</button>" +
      '<span class="sous">' + (prets.length ? pluriel(feuilles.length, "document") + " prêts, " + pluriel(prets.length, "dossier") : pluriel(feuilles.length, "document") + " imprimés au dernier lot") + "</span><span class=\"espace\"></span>" +
      (prets.length && S.role !== "facturation" ? '<button type="button" class="btn plein" id="lot-imprimer-planche" data-act="lot-confirmer">' + ic("imprimante") + "Imprimer ces " + pluriel(feuilles.length, "document") + "</button>" : "") + "</div>";
    h += '<div class="planche">';
    if (!feuilles.length) h += '<div class="vide">' + P.motif(96) + "<p>Aucune feuille prête. Les dossiers complétés apparaissent ici la veille.</p></div>";
    feuilles.forEach(function (f) { h += docHtml(f[0], f[1], false); });
    return h + "</div>";
  }

  /* Vue : patients ------------------------------------------------------------ */
  function lignePatient(p) {
    var d = derniere(p.id), n = prochaine(p.id);
    return '<tr data-act="fiche-patient" data-id="' + p.id + '"><td><button type="button" class="lien" id="patient-' + p.id + '" data-act="fiche-patient" data-id="' + p.id + '">' + e(nomP(p)) + "</button>" + (p.nee ? "<small>née " + e(p.nee) + "</small>" : "") + "</td>" +
      '<td class="num">' + df(p.ddn) + "<small>" + e(P.ageTexte(p.ddn, P.AUJOURDHUI)) + "</small></td>" +
      '<td class="num">' + (p.dn ? e(p.dn) : '<span class="etat a-faire">sans DN</span>') + "</td><td>" + e(p.couverture || "") + "</td>" +
      '<td class="num">' + (d ? df(d.date) : "") + "</td><td>" + (n ? e(n.intervention) + '<small class="num">' + df(n.dateInt) + "</small>" : '<span class="aucun">aucune</span>') + "</td></tr>";
  }
  function vuePatients() {
    var h = '<div class="page"><div class="titre-page"><h1>Patients</h1><p class="sous">' + pluriel(P.patients.length, "patient") + " · la recherche en haut reconnaît seule un DN, une date de naissance ou un nom</p>";
    if (S.role !== "facturation") h += '<span class="espace"></span><button type="button" class="btn plein" id="patients-nouveau" data-act="nouveau-patient">' + ic("plus") + "Nouveau patient</button>";
    h += '</div><div class="table-zone"><table class="liste"><thead><tr><th scope="col">Patient</th><th scope="col">Naissance</th><th scope="col">DN</th><th scope="col">Couverture</th><th scope="col">Dernière consultation</th><th scope="col">Prochaine intervention</th></tr></thead><tbody>';
    P.patients.slice().sort(function (a, b) { return a.nom.localeCompare(b.nom); }).forEach(function (p) { h += lignePatient(p); });

  }

  /* Création de consultation : l'acte d'abord (V1-01), profil (V1-14) ---------------- */
  function creationEtat(p) {
    if (!S.creation || S.creation.pId !== p.id) S.creation = { pId: p.id, acte: "", precision: "", profil: "", site: p.site || "Cardella", q: "" };
    return S.creation;
  }

  }
  function resultatsActes(cr) {
    var q = String(cr.q || "").trim().toUpperCase();

    var h = l.map(function (a, i) { return puceActe(a, cr, "acte-r-" + i); }).join("");

    return h;
  }
  function creationHtml(p) {
    var cr = creationEtat(p), d = derniere(p.id), ac = P.acte(cr.acte);

    var pa = profilAuto(faux), profil = cr.profil || pa.k;

    h += '<div class="etape"><div class="etape-tete"><h3 id="t-acte">Acte</h3><span class="sous">les plus fréquents du site</span>' +
      '<div class="segment petit" role="group" aria-label="Site">' + ["Cardella", "Mamao"].map(function (s) { return '<button type="button" id="cr-site-' + s + '" data-act="cr-site" data-v="' + s + '" aria-pressed="' + (cr.site === s) + '">' + s + "</button>"; }).join("") + "</div></div>";
    h += '<div class="puces" role="group" aria-labelledby="t-acte">' + P.actesFrequents(cr.site, 8).map(function (a, i) { return puceActe(a, cr, "acte-" + i); }).join("") + "</div>";
    h += '<div class="acte-recherche"><div class="champ-r">' + ic("loupe") + '<label for="acte-q" class="sr">Rechercher un autre acte</label><input id="acte-q" data-cr="q" value="' + e(cr.q) + '" autocomplete="off" spellcheck="false" placeholder="Autre acte : rechercher ou saisir"></div></div>' +
      '<div class="acte-resultats" id="acte-resultats" aria-live="polite">' + resultatsActes(cr) + "</div></div>";
    if (cr.acte) {
      if (ac && ac.cote) {
        h += '<div class="etape"><div class="etape-tete"><h3 id="t-prec">Précision</h3><span class="sous">proposée par l\'acte</span></div><div class="puces" role="group" aria-labelledby="t-prec">' +
          P.COTE[ac.cote].map(function (v, i) { return '<button type="button" class="puce-acte" id="prec-' + i + '" data-act="cr-precision" data-v="' + e(v) + '" aria-pressed="' + (cr.precision === v) + '">' + e(v) + "</button>"; }).join("") + "</div></div>";
      }

      if (regles.length) h += '<div class="consignes-acte">' + regles.map(function (x) {
        return '<div class="rappel info">' + ic("document") + '<div><span class="r-tete">' + e(x.titre) + ' <span class="regle" title="' + e(REGLES[x.titre] || "") + '">règle</span></span><p>' + e(x.detail) + "</p></div></div>";
      }).join("") + "</div>";
    }
    h += '<div class="etape"><div class="etape-tete"><h3 id="t-profil">Profil</h3><span class="note-regle">' +
      (cr.profil ? "choisi à la main" : pa.pourquoi ? "choisi d'après " + (pa.k === "pediatrie" ? "l'âge : " : "l'") + e(pa.pourquoi) : "profil par défaut") + "</span></div>" +
      '<div class="segment" role="group" aria-labelledby="t-profil">' + P.profils.map(function (x) { return '<button type="button" id="cr-profil-' + x.k + '" data-act="cr-profil" data-v="' + x.k + '" aria-pressed="' + (profil === x.k) + '">' + x.lib + "</button>"; }).join("") + "</div>" +
      '<p class="note-regle">Pédiatrie : autorisation d\'opérer et représentant légal. Obstétrique : grossesses et terme.</p></div>';
    h += '<div class="creation-actions">' + (d ? '<button type="button" class="btn plein" id="nc-ancien" data-act="nouvelle-cs" data-mode="ancien">' + ic("document") + "Créer à partir de l'ancien dossier</button>" : "") +
      '<button type="button" class="btn' + (d ? "" : " plein") + '" id="nc-vierge" data-act="nouvelle-cs" data-mode="vierge">' + ic("plus") + "Créer, dossier vierge</button>" +
      "<p>" + (d ? "L'ancien dossier du " + df(d.date) + " apporte ATCD, traitements et allergies ; chaque valeur reprise reste à confirmer." : "Aucun dossier antérieur : la fiche part vide.") + (cr.acte ? "" : " L'acte peut aussi se saisir dans la fiche.") + "</p></div>";
    return h + "</div></section>";
  }

  /* Vue : dossier patient ------------------------------------------------------- */
  function vuePatient() {

      info("Date de naissance", df(p.ddn), true) + info("Âge", e(P.ageTexte(p.ddn, P.AUJOURDHUI))) + info("DN", p.dn ? e(p.dn) : "sans DN", true) +
      info("Couverture", e(p.couverture || "à préciser")) + info("Téléphone", e(p.tel || ""), true) + "</section>";
    if (S.role !== "facturation") h += connuHtml(p.id, false);
    h += '<div class="page">';

  function nvVide() { return { nom: "", prenom: "", nee: "", statut: "", ddn: "", sexe: "", dn: "", sansDn: false, couverture: "", tel: "", erreurs: {} }; }

  function isoDepuis(fr) {
